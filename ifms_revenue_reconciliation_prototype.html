<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFMS &mdash; Revenue Collection &amp; Reconciliation (Functional Prototype)</title>
<style>
/* ============================================================
   IFMS Revenue Collection & Reconciliation - Design Tokens
   ============================================================ */
:root{
  --navy-900:#0b2340; --navy-800:#0f2d52; --navy-700:#143a68; --navy-600:#1b4a83;
  --navy-500:#2660a4; --navy-100:#e5edf6; --navy-050:#f2f6fb;
  --teal-700:#0b6b5e; --teal-600:#0f8878; --teal-100:#dff3ef;
  --amber-700:#8a5a00; --amber-600:#b57905; --amber-100:#fdf1d8;
  --red-700:#9b1c1c; --red-600:#c92a2a; --red-100:#fbe3e3;
  --violet-700:#5b21a8; --violet-100:#efe6fb;
  --grey-900:#1f2730; --grey-700:#465361; --grey-600:#5f6b7a; --grey-500:#7d8899;
  --grey-300:#cbd3dd; --grey-200:#e1e7ee; --grey-100:#eef2f7; --grey-050:#f7f9fc;
  --white:#ffffff;
  --ok:var(--teal-600); --warn:var(--amber-600); --err:var(--red-600);
  --radius:6px; --radius-lg:10px;
  --shadow-1:0 1px 2px rgba(16,32,54,.08),0 1px 3px rgba(16,32,54,.06);
  --shadow-2:0 4px 12px rgba(16,32,54,.12);
  --shadow-3:0 12px 36px rgba(11,35,64,.24);
  --sidebar-w:250px; --header-h:60px;
  --ff:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --ff-mono:'Consolas','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ff);font-size:13.5px;color:var(--grey-900);background:var(--grey-100);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--navy-600)}
h1,h2,h3,h4,h5{margin:0;font-weight:600;color:var(--navy-900)}
:focus-visible{outline:2px solid var(--navy-500);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mono{font-family:var(--ff-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
.muted{color:var(--grey-600)}
.small{font-size:11.5px}
.tiny{font-size:10.5px}
.strong{font-weight:600}
.center{text-align:center}
.right{text-align:right}
.hidden{display:none !important}
.mt0{margin-top:0}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.items-end{align-items:flex-end}
.justify-between{justify-content:space-between}.justify-end{justify-content:flex-end}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.grow{flex:1 1 auto}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:linear-gradient(180deg,var(--navy-900),var(--navy-800));color:#cfdcec;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s ease}
.brand{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;gap:10px;align-items:center}
.brand .emblem{width:34px;height:34px;border-radius:7px;background:linear-gradient(145deg,var(--teal-600),var(--navy-500));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;letter-spacing:.5px;flex:0 0 auto}
.brand .t1{color:#fff;font-weight:700;font-size:14px;letter-spacing:.3px}
.brand .t2{color:#8fa9c6;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
.navwrap{overflow-y:auto;flex:1 1 auto;padding:8px 0 20px}
.navwrap::-webkit-scrollbar{width:7px}.navwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.nav-sec{padding:12px 16px 5px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6f8bab;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;color:#cfdcec;cursor:pointer;border-left:3px solid transparent;font-size:13px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(15,136,120,.20);border-left-color:var(--teal-600);color:#fff;font-weight:600}
.nav-item .ico{width:18px;text-align:center;font-size:14px;flex:0 0 18px}
.nav-item .badge-n{margin-left:auto;background:var(--red-600);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:700;line-height:16px;min-width:18px;text-align:center}
.nav-item.locked{opacity:.45;cursor:pointer}
.nav-item.locked:hover{opacity:.7;background:rgba(255,255,255,.05)}
.nav-item.locked::after{content:"\1F512";margin-left:auto;font-size:10px;opacity:.8}
.sidebar-foot{padding:10px 16px;border-top:1px solid rgba(255,255,255,.10);font-size:10.5px;color:#7f9ab8}

#main{flex:1 1 auto;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
#header{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--grey-200);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:30;box-shadow:var(--shadow-1)}
#header .htitle{font-size:15px;font-weight:600;color:var(--navy-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchip{display:inline-flex;align-items:center;gap:6px;background:var(--navy-050);border:1px solid var(--navy-100);color:var(--navy-700);padding:4px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.hsel{border:1px solid var(--grey-300);border-radius:var(--radius);padding:5px 8px;font-size:12px;font-family:inherit;background:var(--white);color:var(--grey-900);max-width:230px}
.bell{position:relative;cursor:pointer;font-size:17px;color:var(--grey-600);padding:4px 6px;border-radius:var(--radius)}
.bell:hover{background:var(--grey-100)}
.bell .cnt{position:absolute;top:-1px;right:-2px;background:var(--red-600);color:#fff;font-size:9.5px;font-weight:700;border-radius:9px;padding:0 4px;line-height:14px;min-width:15px;text-align:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-600);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto}
#content{padding:16px 18px 48px;flex:1 1 auto}
.crumb{font-size:11.5px;color:var(--grey-600);margin-bottom:10px}
.crumb span+span::before{content:"›";margin:0 6px;color:var(--grey-500)}
.crumb .cur{color:var(--navy-700);font-weight:600}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{font-size:19px}
.pagehead .sub{color:var(--grey-600);font-size:12.5px;margin-top:2px;max-width:820px}

/* ---------- Cards / panels ---------- */
.card{background:var(--white);border:1px solid var(--grey-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);margin-bottom:16px}
.card-h{padding:11px 14px;border-bottom:1px solid var(--grey-200);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:13.5px;letter-spacing:.2px}
.card-h .sub{font-size:11.5px;color:var(--grey-600);font-weight:400;margin-top:1px}
.card-b{padding:14px}
.card-b.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1250px){.g6{grid-template-columns:repeat(4,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:980px){.g3,.g2,.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.grid{grid-template-columns:1fr !important}}

/* KPI */
.kpi{background:var(--white);border:1px solid var(--grey-200);border-left:4px solid var(--navy-500);border-radius:var(--radius-lg);padding:11px 13px;box-shadow:var(--shadow-1);min-width:0}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--grey-600);font-weight:700;line-height:1.3}
.kpi .val{font-size:20px;font-weight:700;color:var(--navy-900);margin-top:5px;font-variant-numeric:tabular-nums;word-break:break-word}
.kpi .sec{font-size:11px;color:var(--grey-600);margin-top:3px}
.kpi.ok{border-left-color:var(--teal-600)} .kpi.ok .val{color:var(--teal-700)}
.kpi.warn{border-left-color:var(--amber-600)} .kpi.warn .val{color:var(--amber-700)}
.kpi.err{border-left-color:var(--red-600)} .kpi.err .val{color:var(--red-700)}
.kpi.vio{border-left-color:var(--violet-700)} .kpi.vio .val{color:var(--violet-700)}

/* ---------- Badges ---------- */
.badge{display:inline-block;padding:2px 7px;border-radius:11px;font-size:10.5px;font-weight:700;letter-spacing:.25px;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.b-grey{background:var(--grey-100);color:var(--grey-700);border-color:var(--grey-300)}
.b-green{background:var(--teal-100);color:var(--teal-700);border-color:#a9ded5}
.b-amber{background:var(--amber-100);color:var(--amber-700);border-color:#f0d59a}
.b-red{background:var(--red-100);color:var(--red-700);border-color:#f0b9b9}
.b-blue{background:var(--navy-100);color:var(--navy-700);border-color:#bdd2ea}
.b-violet{background:var(--violet-100);color:var(--violet-700);border-color:#d5c2ef}
.flagpill{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9.5px;font-weight:700;background:var(--amber-100);color:var(--amber-700);border:1px solid #f0d59a;margin-left:3px;white-space:nowrap}
.flagpill.red{background:var(--red-100);color:var(--red-700);border-color:#f0b9b9}
.flagpill.blue{background:var(--navy-100);color:var(--navy-700);border-color:#bdd2ea}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--grey-300);background:var(--white);color:var(--grey-900);padding:6px 12px;border-radius:var(--radius);font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--grey-050);border-color:var(--grey-500)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--navy-600);border-color:var(--navy-600);color:#fff}
.btn-p:hover:not(:disabled){background:var(--navy-700);border-color:var(--navy-700)}
.btn-ok{background:var(--teal-600);border-color:var(--teal-600);color:#fff}
.btn-ok:hover:not(:disabled){background:var(--teal-700);border-color:var(--teal-700)}
.btn-warn{background:var(--amber-600);border-color:var(--amber-600);color:#fff}
.btn-warn:hover:not(:disabled){background:var(--amber-700);border-color:var(--amber-700)}
.btn-dgr{background:var(--red-600);border-color:var(--red-600);color:#fff}
.btn-dgr:hover:not(:disabled){background:var(--red-700);border-color:var(--red-700)}
.btn-sm{padding:3px 8px;font-size:11.5px}
.btn-xs{padding:2px 6px;font-size:10.5px;font-weight:600}
.btn-blk{width:100%}
.btn-group{display:flex;flex-wrap:wrap;gap:7px}

/* ---------- Forms ---------- */
.fld{margin-bottom:11px;min-width:0}
.fld label,.lbl{display:block;font-size:11px;font-weight:700;color:var(--grey-700);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.fld label .req{color:var(--red-600)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--grey-300);border-radius:var(--radius);padding:6px 9px;font-size:12.5px;font-family:inherit;color:var(--grey-900);background:var(--white)}
.inp:focus{border-color:var(--navy-500);box-shadow:0 0 0 2px rgba(38,96,164,.14);outline:none}
.inp:disabled,.inp[readonly]{background:var(--grey-100);color:var(--grey-600)}
textarea.inp{min-height:62px;resize:vertical}
.help-txt{font-size:10.5px;color:var(--grey-600);margin-top:2px}
.filterbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;padding:11px 14px;background:var(--grey-050);border-bottom:1px solid var(--grey-200);align-items:end}
.filterbar .fld{margin-bottom:0}
.chkline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey-700)}
.chkline input{margin:0}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--grey-200)}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th{background:var(--navy-050);color:var(--navy-800);text-align:left;padding:7px 9px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.45px;border-bottom:2px solid var(--navy-100);white-space:nowrap;position:sticky;top:0;z-index:2}
table.dt th.sortable{cursor:pointer;user-select:none}
table.dt th.sortable:hover{background:var(--navy-100)}
table.dt th .arw{color:var(--navy-500);font-size:9px;margin-left:3px}
table.dt td{padding:6px 9px;border-bottom:1px solid var(--grey-200);vertical-align:top}
table.dt tbody tr:hover{background:var(--navy-050)}
table.dt tbody tr.sel{background:var(--teal-100)}
table.dt tfoot td{background:var(--grey-050);font-weight:700;border-top:2px solid var(--grey-300);padding:7px 9px}
.tbl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;flex-wrap:wrap}
.tbl-search{min-width:190px;flex:0 1 260px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--grey-200);flex-wrap:wrap;font-size:11.5px;color:var(--grey-600)}
.pager{display:flex;gap:4px;align-items:center}
.pager button{border:1px solid var(--grey-300);background:#fff;border-radius:4px;min-width:26px;height:24px;font-size:11.5px;cursor:pointer;color:var(--grey-700);padding:0 6px}
.pager button.on{background:var(--navy-600);border-color:var(--navy-600);color:#fff;font-weight:700}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:34px 14px;text-align:center;color:var(--grey-600)}
.empty .ic{font-size:28px;opacity:.4;display:block;margin-bottom:6px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--grey-200);overflow-x:auto;margin-bottom:14px}
.tab{padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--grey-600);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;user-select:none}
.tab:hover{color:var(--navy-700)}
.tab.active{color:var(--navy-800);border-bottom-color:var(--teal-600)}

/* ---------- Modal / drawer ---------- */
.ovl{position:fixed;inset:0;background:rgba(11,35,64,.52);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
.modal{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);width:100%;max-width:720px;animation:pop .16s ease}
.modal.w900{max-width:900px}.modal.w1100{max-width:1100px}.modal.w520{max-width:520px}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-h{padding:12px 16px;border-bottom:1px solid var(--grey-200);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--navy-050);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-h h3{font-size:14.5px}
.modal-h .sub{font-size:11.5px;color:var(--grey-600);font-weight:400}
.modal-x{border:none;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--grey-600);padding:0 4px}
.modal-x:hover{color:var(--red-600)}
.modal-b{padding:16px;max-height:70vh;overflow-y:auto}
.modal-f{padding:11px 16px;border-top:1px solid var(--grey-200);display:flex;justify-content:flex-end;gap:8px;background:var(--grey-050);border-radius:0 0 var(--radius-lg) var(--radius-lg);flex-wrap:wrap}

/* ---------- Toast ---------- */
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:370px}
.toast{background:var(--navy-900);color:#fff;padding:10px 13px;border-radius:var(--radius);box-shadow:var(--shadow-2);font-size:12.5px;display:flex;gap:9px;align-items:flex-start;animation:slidein .2s ease;border-left:4px solid var(--navy-500)}
.toast.ok{border-left-color:var(--teal-600)}.toast.warn{border-left-color:var(--amber-600)}.toast.err{border-left-color:var(--red-600)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ---------- Misc components ---------- */
.kv{display:grid;grid-template-columns:170px 1fr;gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--grey-600);font-weight:600;font-size:11.5px}
.kv dd{margin:0;color:var(--grey-900);word-break:break-word}
.box{border:1px solid var(--grey-200);border-radius:var(--radius);padding:11px;background:var(--grey-050)}
.box.ok{background:var(--teal-100);border-color:#a9ded5}
.box.warn{background:var(--amber-100);border-color:#f0d59a}
.box.err{background:var(--red-100);border-color:#f0b9b9}
.box.info{background:var(--navy-050);border-color:var(--navy-100)}
.box h4{font-size:12px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--grey-700);padding:9px 14px;background:var(--grey-050);border-top:1px solid var(--grey-200)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--grey-200)}
.tl-item{position:relative;padding-bottom:12px}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--navy-500);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--navy-500)}
.tl-item.ok::before{background:var(--teal-600);box-shadow:0 0 0 1.5px var(--teal-600)}
.tl-item.warn::before{background:var(--amber-600);box-shadow:0 0 0 1.5px var(--amber-600)}
.tl-item.err::before{background:var(--red-600);box-shadow:0 0 0 1.5px var(--red-600)}
.tl-item .tt{font-size:12.5px;font-weight:600}
.tl-item .td{font-size:11px;color:var(--grey-600)}
.dropzone{border:2px dashed var(--grey-300);border-radius:var(--radius-lg);padding:20px;text-align:center;background:var(--grey-050);cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--teal-600);background:var(--teal-100)}
.dropzone .ic{font-size:28px;opacity:.55;display:block;margin-bottom:5px}
.progress{height:7px;background:var(--grey-200);border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--teal-600)}
.steps{display:flex;flex-wrap:wrap;gap:0;margin-bottom:12px}
.step{flex:1 1 auto;min-width:110px;padding:7px 9px;background:var(--grey-100);border:1px solid var(--grey-200);font-size:10.5px;color:var(--grey-600);position:relative;text-align:center}
.step.done{background:var(--teal-100);border-color:#a9ded5;color:var(--teal-700);font-weight:700}
.step.cur{background:var(--navy-600);border-color:var(--navy-600);color:#fff;font-weight:700}
.step .n{display:block;font-size:9px;opacity:.8}
.nowrap-scroll{overflow-x:auto}
.warnbar{background:var(--amber-100);border:1px solid #f0d59a;color:var(--amber-700);padding:8px 12px;border-radius:var(--radius);font-size:12px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.errbar{background:var(--red-100);border:1px solid #f0b9b9;color:var(--red-700);padding:8px 12px;border-radius:var(--radius);font-size:12px;font-weight:600;margin-bottom:12px}
.okbar{background:var(--teal-100);border:1px solid #a9ded5;color:var(--teal-700);padding:8px 12px;border-radius:var(--radius);font-size:12px;font-weight:600;margin-bottom:12px}
.letter{background:#fff;border:1px solid var(--grey-300);padding:26px 30px;font-family:'Times New Roman',Georgia,serif;font-size:13.5px;line-height:1.7;color:#111}
.letter h4{font-family:'Times New Roman',Georgia,serif;text-align:center;font-size:15px;margin-bottom:4px}
.letter .lhead{text-align:center;border-bottom:1.5px solid #333;padding-bottom:9px;margin-bottom:14px}
.letter table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.letter table td,.letter table th{border:1px solid #888;padding:5px 7px}
.formula{background:var(--navy-050);border:1px solid var(--navy-100);border-radius:var(--radius);padding:9px 11px;font-family:var(--ff-mono);font-size:11.5px;color:var(--navy-800);line-height:1.7;overflow-x:auto}
.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}
.ev-col{border:1px solid var(--grey-200);border-radius:var(--radius);overflow:hidden}
.ev-col h5{background:var(--navy-050);padding:6px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy-800);border-bottom:1px solid var(--grey-200)}
.ev-col .body{padding:9px}
.testrow{display:flex;gap:9px;padding:6px 9px;border-bottom:1px solid var(--grey-200);font-size:12px;align-items:flex-start}
.testrow .st{flex:0 0 54px;font-weight:700;font-size:10.5px}
.testrow.pass .st{color:var(--teal-700)} .testrow.fail .st{color:var(--red-700)}
.testrow.fail{background:var(--red-100)}
svg .gridline{stroke:var(--grey-200);stroke-width:1}
svg text{font-family:var(--ff);fill:var(--grey-700)}
.chart-legend{display:flex;flex-wrap:wrap;gap:9px;font-size:10.5px;color:var(--grey-700);margin-top:7px}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
.ro-note{background:var(--navy-050);border-left:3px solid var(--navy-500);padding:6px 10px;font-size:11.5px;color:var(--navy-700);border-radius:0 var(--radius) var(--radius) 0;margin-bottom:10px}
@media print{#sidebar,#header,.no-print{display:none !important}#main{margin-left:0}.ovl{position:static;background:none;padding:0}.modal{box-shadow:none;max-width:100%}.modal-h,.modal-f{display:none}.modal-b{max-height:none;overflow:visible}}
@media(max-width:900px){#sidebar{transform:translateX(-100%)}#sidebar.open{transform:none}#main{margin-left:0}.menu-toggle{display:inline-flex !important}}
.menu-toggle{display:none}
</style>

    <main id="content" tabindex="-1"></main>
  </div>
</div>

/* ---------- escaping & text ---------- */
function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function up(v){ return (v === null || v === undefined) ? '' : String(v).trim().toUpperCase(); }
function tx(v){ return (v === null || v === undefined) ? '' : String(v).trim(); }
function dash(v){ var s = tx(v); return s === '' ? '<span class="muted">—</span>' : esc(s); }

/* ---------- numbers & currency (Indian grouping) ---------- */
function num(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  var s = tx(v).replace(/,/g,'');
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function r2(n){ return Math.round((num(n) + Number.EPSILON) * 100) / 100; }
function inGroup(intPart){
  intPart = String(intPart);
  if(intPart.length <= 3) return intPart;
  var last3 = intPart.slice(-3);
  var rest = intPart.slice(0, -3);
  rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return rest + ',' + last3;
}
function money(v, dec){
  var n = r2(v);
  var neg = n < 0; n = Math.abs(n);
  var d = (dec === undefined) ? 2 : dec;
  var parts = n.toFixed(d).split('.');
  var s = inGroup(parts[0]) + (parts[1] ? '.' + parts[1] : '');
  return (neg ? '-' : '') + '\u20B9 ' + s;
}
function money0(v){ return money(v, 0); }
function plain(v, dec){
  var d = (dec === undefined) ? 2 : dec;
  var n = r2(v); var neg = n < 0; n = Math.abs(n);
  var parts = n.toFixed(d).split('.');
  return (neg ? '-' : '') + inGroup(parts[0]) + (parts[1] ? '.' + parts[1] : '');
}
function cnt(v){ return inGroup(String(Math.round(num(v)))); }
function compact(v){
  var n = Math.abs(num(v));
  if(n >= 10000000) return '\u20B9 ' + plain(num(v) / 10000000, 2) + ' Cr';
  if(n >= 100000)   return '\u20B9 ' + plain(num(v) / 100000, 2) + ' Lakh';
  return money(v, 2);
}

/* ---------- dates ---------- */
function isISO(s){ return /^\d{4}-\d{2}-\d{2}$/.test(tx(s)); }
function validDate(s){
  if(!isISO(s)) return false;
  var p = tx(s).split('-'); var y = +p[0], m = +p[1], d = +p[2];
  if(m < 1 || m > 12 || d < 1 || d > 31) return false;
  var dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
}
function fmtDate(s){
  if(!validDate(s)) return tx(s) === '' ? '' : tx(s);
  var p = tx(s).split('-');
  return p[2] + '-' + MONTHS[(+p[1]) - 1] + '-' + p[0];
}
function fmtDateDash(s){ var f = fmtDate(s); return f === '' ? '<span class="muted">—</span>' : esc(f); }
function toUTC(s){ var p = tx(s).split('-'); return Date.UTC(+p[0], (+p[1]) - 1, +p[2]); }
function dayDiff(a, b){
  if(!validDate(a) || !validDate(b)) return null;
  return Math.round((toUTC(b) - toUTC(a)) / 86400000);
}
function addDays(s, n){
  if(!validDate(s)) return '';
  var d = new Date(toUTC(s) + n * 86400000);
  return d.toISOString().slice(0, 10);
}
function nowStamp(){
  var d = new Date();
  function p2(x){ return (x < 10 ? '0' : '') + x; }
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' +
         p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
}
function fmtStamp(s){
  var t = tx(s); if(t.length < 10) return esc(t);
  return fmtDate(t.slice(0, 10)) + ' ' + esc(t.slice(11));
}
function bizDate(){ return (DB && DB.masters.config.bizDate) || '2026-09-15'; }

/* ---------- CSV parser (handles quoted values containing commas) ---------- */
function parseCSV(text){
  var rows = [], row = [], val = '', inQ = false, i = 0;
  text = String(text).replace(/^\uFEFF/, '');
  while(i < text.length){
    var c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i + 1] === '"'){ val += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      val += c; i++; continue;
    }
    if(c === '"'){ inQ = true; i++; continue; }
    if(c === ','){ row.push(val); val = ''; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){ row.push(val); rows.push(row); row = []; val = ''; i++; continue; }
    val += c; i++;
  }
  if(val !== '' || row.length){ row.push(val); rows.push(row); }
  return rows.filter(function(r){ return r.length > 1 || tx(r[0]) !== ''; });
}
function csvToObjects(text){
  var rows = parseCSV(text);
  if(!rows.length) return { headers: [], rows: [] };
  var headers = rows[0].map(function(h){ return tx(h).toLowerCase(); });
  var out = [];
  for(var i = 1; i < rows.length; i++){
    var o = { __line: i + 1 };
    for(var j = 0; j < headers.length; j++) o[headers[j]] = tx(rows[i][j]);
    out.push(o);
  }
  return { headers: headers, rows: out };
}
function csvCell(v){
  var s = (v === null || v === undefined) ? '' : String(v);
  s = s.replace(/<[^>]*>/g, '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadText(filename, text, mime){
  var blob = new Blob([text], { type: (mime || 'text/csv') + ';charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function exportCSV(filename, headers, rows, meta){
  if(!can('export')){ toast('Export not permitted for this role.', 'err'); return; }
  var lines = [];
  if(meta && meta.length){
    meta.forEach(function(m){ lines.push(csvCell(m[0]) + ',' + csvCell(m[1])); });
    lines.push('');
  }
  lines.push(headers.map(csvCell).join(','));
  rows.forEach(function(r){ lines.push(r.map(csvCell).join(',')); });
  downloadText(filename, lines.join('\n'));
  audit('Export', 'EXPORT_CSV', 'File', filename, '', String(rows.length) + ' rows', 'CSV export generated');
  save();
  toast('Exported ' + filename + ' (' + rows.length + ' rows).', 'ok');
}

      (opts.sub ? '<div class="sub">' + esc(opts.sub) + '</div>' : '') + '</div>' +

  el.querySelector('[data-mx]').onclick = close;
  el.onmousedown = function(e){ if(e.target === el && opts.dismissable !== false) close(); };
  (opts.buttons || []).forEach(function(b, i){

      var keep = b.fn ? b.fn(el, close) : false;

  if(opts.onOpen) opts.onOpen(el, close);
  var f = el.querySelector('input,select,textarea,button');
  if(f) try{ f.focus(); }catch(e){}
  return { el: el, close: close };
}

function mountTable(opts){

function tableRows(id){
  var S = TBL[id]; if(!S) return [];
  var o = S.o, rows = o.rows.slice();
  if(S.q){
    var q = S.q.toLowerCase();
    rows = rows.filter(function(r){
      return o.cols.some(function(c){
        var v = c.raw ? c.raw(r) : r[c.k];
        return String(v === undefined || v === null ? '' : v).toLowerCase().indexOf(q) >= 0;
      });
    });
  }
  if(S.sortK){
    var col = null;
    o.cols.forEach(function(c){ if(c.k === S.sortK) col = c; });
    if(col){
      var mul = S.dir === 'asc' ? 1 : -1;
      rows.sort(function(a, b){
        var va = col.raw ? col.raw(a) : a[col.k];
        var vb = col.raw ? col.raw(b) : b[col.k];
        if(col.sort === 'num'){ return (num(va) - num(vb)) * mul; }
        return String(va === undefined ? '' : va).localeCompare(String(vb === undefined ? '' : vb)) * mul;
      });
    }
  }
  return rows;
}
function renderTable(id){

      o.cols.forEach(function(c){

        if(c.foot === 'label'){ h += '<td class="' + (c.cls || '') + '">Total (' + cnt(total) + ')</td>'; return; }

      });

      h += '<button data-tp="' + id + '|1" ' + (S.page === 1 ? 'disabled' : '') + '>&laquo;</button>';

      h += '<button data-tp="' + id + '|' + (S.page + 1) + '" ' + (S.page === pages ? 'disabled' : '') + '>&rsaquo;</button>';
      h += '<button data-tp="' + id + '|' + pages + '" ' + (S.page === pages ? 'disabled' : '') + '>&raquo;</button>';
      h += '</div></div>';
    }
  }
  if(o.legend) h += '<div class="legend">' + o.legend + '</div>';

}
function wireTable(id){
  var S = TBL[id], host = document.getElementById('tw_' + id);
  if(!S || !host) return;
  var q = host.querySelector('[data-tq]');
  if(q) q.oninput = function(){ S.q = this.value; S.page = 1; renderTable(id); var n = document.querySelector('#tw_' + id + ' [data-tq]'); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  host.querySelectorAll('[data-ts]').forEach(function(th){
    th.onclick = function(){
      var k = this.getAttribute('data-ts').split('|')[1];
      if(S.sortK === k) S.dir = (S.dir === 'asc' ? 'desc' : 'asc'); else { S.sortK = k; S.dir = 'asc'; }
      renderTable(id);
    };
  });
  host.querySelectorAll('[data-tp]').forEach(function(b){
    b.onclick = function(){ S.page = +this.getAttribute('data-tp').split('|')[1]; renderTable(id); };
  });
  var xb = host.querySelector('[data-tx]');
  if(xb) xb.onclick = function(){ exportTable(id); };
  var all = host.querySelector('[data-tall]');
  if(all) all.onclick = function(){
    var on = this.checked;

    if(S.o.onSelect) S.o.onSelect(selectedKeys(id));
  };
  host.querySelectorAll('[data-trs]').forEach(function(cb){
    cb.onclick = function(){
      var key = this.getAttribute('data-trs').split('|').slice(1).join('|');
      S.sel[key] = this.checked;
      var tr = this.closest('tr'); if(tr) tr.classList.toggle('sel', this.checked);
      if(S.o.onSelect) S.o.onSelect(selectedKeys(id));
    };
  });
}
function selectedKeys(id){

  for(var k in S.sel) if(S.sel[k]) out.push(k);
  return out;
}
function clearSel(id){ if(TBL[id]) TBL[id].sel = {}; }
function exportTable(id){

/* ===================== FRAGMENT 07: RECONCILIATION & SLA ENGINE ===================== */

/* ---------- normalisation helpers ---------- */
function nrm(v){ return up(v); }
function nAmt(v){ return r2(num(v)); }

function approvedBatchIds(){
  var ids = {};
  DB.batches.forEach(function(b){ if(b.status === 'Approved') ids[b.no] = true; });
  return ids;
}
function scopedRecords(list, scope, ok){
  return list.filter(function(r){
    if(r.batch && !ok[r.batch]) return false;
    if(!scope) return true;
    if(scope.source && nrm(r.revenue_source) !== nrm(scope.source)) return false;
    if(scope.pao && nrm(r.pao_code) !== nrm(scope.pao)) return false;
    if(scope.dept && nrm(r.department_code) !== nrm(scope.dept)) return false;
    if(scope.bank && r.bank_code && nrm(r.bank_code) !== nrm(scope.bank)) return false;
    if(scope.from){
      var d = r.payment_date || r.bank_remittance_date || r.rbi_credit_date || r.scroll_date || r.rbi_file_date;
      if(validDate(d) && d < scope.from) return false;
    }
    if(scope.to){
      var d2 = r.payment_date || r.bank_remittance_date || r.rbi_credit_date || r.scroll_date || r.rbi_file_date;
      if(validDate(d2) && d2 > scope.to) return false;
    }
    return true;
  });
}

/* Identifier selection follows the configured key precedence:
   CIN > Challan No > CPIN > Portal transaction / Bank reference. */
function keyParts(r, leg){
  var order = [];
  if(leg === 'portal') order = [['CIN', r.cin], ['CHALLAN', r.challan_no], ['CPIN', r.cpin], ['PORTAL_TXN', r.portal_transaction_id]];
  if(leg === 'bank')   order = [['CIN', r.cin], ['CHALLAN', r.challan_no], ['CPIN', r.cpin], ['BANK_REF', r.bank_reference_no]];
  if(leg === 'rbi')    order = [['CIN', r.cin], ['CHALLAN', r.challan_no], ['BANK_REF', r.bank_reference_no], ['UTR', r.utr_no]];
  for(var i = 0; i < order.length; i++){
    if(nrm(order[i][1]) !== '') return { field: order[i][0], value: nrm(order[i][1]) };
  }
  return { field: 'NONE', value: 'UNKEYED-' + (r.__id || Math.random()) };
}
function groupKey(r, leg){
  var kp = keyParts(r, leg);
  return nrm(r.revenue_source) + '::' + kp.value;
}
/* Secondary (challan) key lets an alternate identifier still bring legs together. */
function altKeys(r, leg){
  var out = {};
  ['cin', 'challan_no', 'cpin', 'bank_reference_no', 'utr_no', 'portal_transaction_id'].forEach(function(f){
    if(nrm(r[f]) !== '') out[nrm(r.revenue_source) + '::' + nrm(r[f])] = true;
  });
  return Object.keys(out);
}

/* ---------- SLA / penal interest ---------- */
function slaRuleFor(mode, source, bank){
  var m = up(mode), ms = M().slaRules;
  var wanted = (m === 'CHEQUE' || m === 'DD') ? 'SLA-INSTR' : (m === 'CASH') ? 'SLA-CASH' : 'SLA-ONLINE';
  for(var i = 0; i < ms.length; i++){
    if(ms[i].id === wanted && ms[i].active !== false &&
       (ms[i].bank === 'ALL' || nrm(ms[i].bank) === nrm(bank)) &&
       (ms[i].source === 'ALL' || nrm(ms[i].source) === nrm(source))) return ms[i];
  }
  return ms[0];
}
function slaForBankLeg(b){
  var rule = slaRuleFor(b.payment_mode, b.revenue_source, b.bank_code);
  var m = up(b.payment_mode);
  var instrument = (m === 'CHEQUE' || m === 'DD');
  var base = (instrument && validDate(b.instrument_realization_date)) ? b.instrument_realization_date : b.payment_received_date;
  var actual = dayDiff(base, b.bank_remittance_date);
  if(actual === null) actual = 0;
  if(actual < 0) actual = 0;
  var allowed = num(rule.days) + num(rule.grace);
  var delay = Math.max(0, actual - allowed);
  var rate = num(rule.rate);
  var basisDays = num(M().config.penalDayBasis) || 365;
  var penal = r2(nAmt(b.amount) * (rate / 100) * delay / basisDays);
  return {
    ruleId: rule.id, baseDate: base, baseKind: instrument ? 'Instrument realisation date' : 'Payment received date',
    actual: actual, allowed: allowed, slaDays: num(rule.days), grace: num(rule.grace),
    delay: delay, rate: rate, basisDays: basisDays, penal: penal,
    minAmt: num(rule.minAmt), recoverable: penal >= num(rule.minAmt) && delay > 0,
    formula: 'Penal interest = ' + plain(nAmt(b.amount)) + ' \u00D7 ' + plain(rate, 2) + '% \u00D7 ' + delay + ' \u00F7 ' + basisDays + ' = ' + plain(penal)
  };
}

/* ---------- attribute guard ---------- */
function attrGuard(P, B, R){
  var issues = [];
  function chk(field, label){
    var vals = {};
    P.concat(B).concat(R).forEach(function(r){ if(nrm(r[field]) !== '') vals[nrm(r[field])] = true; });
    var k = Object.keys(vals);
    if(k.length > 1) issues.push(label + ' differs across legs (' + k.join(' / ') + ')');
  }
  chk('revenue_source', 'Revenue source');
  chk('department_code', 'Department');
  chk('pao_code', 'PAO');
  chk('receipt_head', 'Receipt head');
  return issues;
}

/* ---------- duplicate detection ---------- */
function dupSignatures(list, dateField){
  var sig = {}, dups = [];
  list.forEach(function(r){
    var s = nrm(r.challan_no) + '|' + nAmt(r.amount) + '|' + nrm(r[dateField]);
    sig[s] = (sig[s] || 0) + 1;
  });
  for(var k in sig) if(sig[k] > 1) dups.push(k);
  return dups;
}

/* =====================================================================
   MAIN RECONCILIATION RUN
   ===================================================================== */
function runRecon(scope){
  var cfg = M().config;
  var tolAmt = num(cfg.amtTolerance) || 0.01;
  var tolDays = num(cfg.dateTolerance);
  var today = bizDate();
  var ok = approvedBatchIds();
  var P = scopedRecords(DB.portal, scope, ok);
  var B = scopedRecords(DB.bank, scope, ok);
  var R = scopedRecords(DB.rbi, scope, ok);

  var groups = {};
  function bucket(key){
    if(!groups[key]) groups[key] = { key: key, P: [], B: [], R: [] };
    return groups[key];
  }
  /* index portal by all of its identifiers so bank / RBI legs can attach on any of them */
  var idx = {};
  P.forEach(function(r){
    var gk = groupKey(r, 'portal');
    bucket(gk).P.push(r);
    altKeys(r, 'portal').forEach(function(k){ idx[k] = gk; });
  });
  function attach(r, leg){
    var aks = altKeys(r, leg);
    for(var i = 0; i < aks.length; i++){ if(idx[aks[i]]) return idx[aks[i]]; }
    var gk = groupKey(r, leg);
    aks.forEach(function(k){ if(!idx[k]) idx[k] = gk; });
    return gk;
  }
  B.forEach(function(r){ bucket(attach(r, 'bank')).B.push(r); });
  R.forEach(function(r){ bucket(attach(r, 'rbi')).R.push(r); });

  DB.revIdMap = DB.revIdMap || {};
  var results = [], penalties = [];

  Object.keys(groups).forEach(function(gk){
    var g = groups[gk];
    var pAmt = r2(g.P.reduce(function(a, r){ return a + nAmt(r.amount); }, 0));
    var bAmt = r2(g.B.reduce(function(a, r){ return a + nAmt(r.amount); }, 0));
    var rAmt = r2(g.R.reduce(function(a, r){ return a + nAmt(r.amount); }, 0));
    var lead = g.P[0] || g.B[0] || g.R[0];

    /* SLA evaluation for every bank leg in this group */
    var slaMax = 0, penalTotal = 0, instrBasis = false;
    g.B.forEach(function(b){
      var s = slaForBankLeg(b);
      b.__sla = s;
      if(s.delay > slaMax) slaMax = s.delay;
      penalTotal = r2(penalTotal + s.penal);
      if(s.baseKind.indexOf('realisation') >= 0) instrBasis = true;
      if(s.delay > 0){
        penalties.push({
          id: 'PEN-' + nrm(b.challan_no) + '-' + nrm(b.bank_reference_no),
          bank: b.bank_code, branch: b.branch_code, source: b.revenue_source, dept: b.department_code, pao: b.pao_code,
          challan: b.challan_no, cin: b.cin, payer: b.payer_name, mode: b.payment_mode,
          recvDate: b.payment_received_date, realDate: b.instrument_realization_date,
          remitDate: b.bank_remittance_date, rbiDate: (g.R[0] ? g.R[0].rbi_credit_date : ''),
          amount: nAmt(b.amount), slaDays: s.slaDays, grace: s.grace, actual: s.actual, delay: s.delay,
          rate: s.rate, penal: s.penal, formula: s.formula, baseDate: s.baseDate, baseKind: s.baseKind,
          recoverable: s.recoverable, ruleId: s.ruleId, scroll: b.scroll_no, utr: b.utr_no
        });
      }
    });

    /* ---------- RAT: bank / RBI credit with no portal record ---------- */
    if(!g.P.length){
      if(!DB.revIdMap[gk]) DB.revIdMap[gk] = newRevId();
      var ratAmt = rAmt > 0 ? rAmt : bAmt;
      results.push(mkResult({
        gk: gk, revId: DB.revIdMap[gk], lead: lead, g: g,
        pAmt: 0, bAmt: bAmt, rAmt: rAmt, diff: r2(0 - ratAmt),
        status: 'RAT', matchType: 'Unmatched Credit', rule: 'RR-04',
        reason: 'Receipt Awaiting Transfer — a ' + (rAmt > 0 ? 'confirmed RBI government-account credit' : 'bank scroll receipt') +
                ' of ' + money(ratAmt) + ' was located on identifier ' + gk.split('::')[1] +
                ' but no departmental portal / challan record exists. RBI amount (' + money(rAmt) + ') is greater than portal amount (' + money(0) + ').',
        flags: [], slaDelay: slaMax, penal: penalTotal, today: today
      }));
      return;
    }

    var lead2 = g.P[0];
    var ageing = dayDiff(lead2.payment_date, today);
    if(ageing === null) ageing = 0;
    var guard = attrGuard(g.P, g.B, g.R);
    var dupSigs = dupSignatures(g.B, 'payment_received_date');
    var idLabel = keyParts(lead2, 'portal');

    /* effective portal date: instrument realisation overrides the payment date for cheque/DD */
    var effDate = lead2.payment_date;
    g.B.forEach(function(b){
      var m = up(b.payment_mode);
      if((m === 'CHEQUE' || m === 'DD') && validDate(b.instrument_realization_date)) effDate = b.instrument_realization_date;
    });
    var rbiDates = g.R.map(function(r){ return r.rbi_credit_date; }).filter(validDate).sort();
    var lastRbi = rbiDates.length ? rbiDates[rbiDates.length - 1] : '';
    var dDiff = lastRbi ? dayDiff(effDate, lastRbi) : null;
    var fl = [];
    if(slaMax > 0) fl.push('Late Remittance');
    if(instrBasis) fl.push('Instrument Realisation Basis');

    var status, matchType, reason, rule, diff = r2(pAmt - (rAmt > 0 ? rAmt : bAmt));

    /* 1. duplicate bank/RBI legs against a single portal receipt */
    if(dupSigs.length && bAmt > r2(pAmt + tolAmt)){
      status = 'Duplicate'; matchType = 'Duplicate Settlement'; rule = 'RR-05';
      diff = r2(bAmt - pAmt);
      reason = 'Duplicate detected — ' + g.B.length + ' agency-bank scroll lines carry the same challan / amount / receipt-date signature. Bank total ' +
               money(bAmt) + ' exceeds the portal receipt of ' + money(pAmt) + ' by ' + money(diff) +
               '. RBI confirmed only ' + money(rAmt) + '. An explicit decision is required before booking.';
      fl.push('Excess Credit');
    }
    /* 2. attribute guard — never auto-match on conflicting master attributes */
    else if(guard.length){
      status = 'Under Investigation'; matchType = 'Attribute Conflict'; rule = 'RR-08';
      reason = 'Attribute guard triggered — ' + guard.join('; ') + '. Amount and reference agreement is not sufficient to auto-match when master attributes disagree.';
    }
    /* 3. no bank and no RBI leg at all */
    else if(!g.B.length && !g.R.length){
      var slaAllow = slaRuleFor(lead2.payment_mode, lead2.revenue_source, '').days;
      if(ageing > num(slaAllow)){
        status = 'Suspend'; matchType = 'Portal Only'; rule = 'RR-03';
        reason = 'Portal receipt of ' + money(pAmt) + ' dated ' + fmtDate(lead2.payment_date) +
                 ' has neither an agency-bank scroll line nor an RBI government-account credit. Ageing of ' + ageing +
                 ' day(s) has passed the permitted remittance SLA of ' + slaAllow + ' day(s) as on demo business date ' + fmtDate(today) +
                 '. Portal amount is greater than RBI amount — held in suspense.';
        fl.push('Bank Record Missing'); fl.push('RBI Credit Missing');
      }else{
        status = 'Pending'; matchType = 'Awaiting Settlement'; rule = 'RR-03';
        reason = 'Portal receipt is within the permitted remittance SLA. Awaiting agency-bank scroll and RBI credit confirmation.';
      }
    }
    /* 4. bank present, RBI credit not yet received */
    else if(!g.R.length){
      if(Math.abs(pAmt - bAmt) <= tolAmt){
        var slaAllow2 = slaRuleFor(lead2.payment_mode, lead2.revenue_source, g.B[0].bank_code).days;
        if(ageing > num(slaAllow2)){
          status = 'Suspend'; matchType = 'Two-Way (Portal + Bank)'; rule = 'RR-03';
          reason = 'Portal and agency-bank amounts agree at ' + money(pAmt) + ' on ' + idLabel.field +
                   ', but the RBI government-account credit is missing after the permitted SLA of ' + slaAllow2 +
                   ' day(s). Final Matched status requires RBI credit confirmation — held in suspense.';
        }else{
          status = 'Pending'; matchType = 'Two-Way (Portal + Bank)'; rule = 'RR-03';
          reason = 'Portal and agency-bank amounts agree at ' + money(pAmt) + '. RBI credit is still within the permitted SLA window.';
        }
        fl.push('RBI Credit Missing');
      }else{
        status = 'Mismatch'; matchType = 'Amount Variance'; rule = 'RR-06';
        diff = r2(pAmt - bAmt);
        reason = 'Portal amount ' + money(pAmt) + ' does not agree with the agency-bank scroll total of ' + money(bAmt) +
                 ' (difference ' + money(diff) + '), and no RBI credit is available.';
        fl.push('RBI Credit Missing');
      }
    }
    /* 5. full three-leg evaluation */
    else{
      var bOk = Math.abs(pAmt - bAmt) <= tolAmt;
      var rOk = Math.abs(pAmt - rAmt) <= tolAmt;
      if(bOk && rOk){
        matchType = (g.B.length > 1 || g.R.length > 1) ? 'One-to-Many' : 'One-to-One';
        var partsTxt = (matchType === 'One-to-Many')
          ? ' Settlement received in ' + g.B.length + ' bank leg(s) / ' + g.R.length + ' RBI credit(s): ' +
            g.R.map(function(r){ return money(r.amount); }).join(' + ') + ' = ' + money(rAmt) + '.'
          : '';
        if(dDiff !== null && dDiff <= tolDays){
          status = 'Matched'; rule = (matchType === 'One-to-Many') ? 'RR-02' : 'RR-01';
          reason = 'Three-way match on ' + idLabel.field + ' ' + idLabel.value + ' — portal, agency bank and RBI credit all equal ' +
                   money(pAmt) + '. RBI credit dated ' + fmtDate(lastRbi) + ' is ' + dDiff + ' day(s) from the effective portal date ' +
                   fmtDate(effDate) + ', within the tolerance of ' + tolDays + ' day(s).' + partsTxt;
        }else if(dDiff !== null && slaMax > 0 && dDiff <= tolDays + slaMax){
          status = 'Matched'; rule = (matchType === 'One-to-Many') ? 'RR-02' : 'RR-01';
          reason = 'Three-way amount match of ' + money(pAmt) + ' on ' + idLabel.field + ' ' + idLabel.value +
                   '. The RBI credit date variance of ' + dDiff + ' day(s) exceeds the base tolerance of ' + tolDays +
                   ' day(s) but is fully explained by a quantified agency-bank remittance delay of ' + slaMax +
                   ' day(s); penal interest of ' + money(penalTotal) + ' has been raised instead of an investigation case.' + partsTxt;
        }else{
          status = 'Under Investigation'; rule = 'RR-07'; matchType = 'Date Variance';
          reason = 'Amounts agree at ' + money(pAmt) + ' but the RBI credit dated ' + fmtDate(lastRbi) + ' is ' + dDiff +
                   ' day(s) from the effective portal date ' + fmtDate(effDate) + ', beyond the tolerance of ' + tolDays +
                   ' day(s) and not explained by a measured bank remittance delay.';
          fl.push('Date Variance');
        }
      }else{
        status = 'Mismatch'; matchType = 'Amount Variance'; rule = 'RR-06';
        var cmp = rOk ? bAmt : rAmt;
        diff = r2(pAmt - (rAmt > 0 ? rAmt : bAmt));
        reason = 'Amount variance beyond the tolerance of ' + money(tolAmt) + ' — portal ' + money(pAmt) +
                 ', agency bank ' + money(bAmt) + ', RBI credit ' + money(rAmt) + '. Difference against the settled amount is ' +
                 money(diff) + '. Booking to the revenue receipt head is blocked until resolved.';
        if(!bOk) fl.push('Bank Variance');
        if(!rOk) fl.push('RBI Variance');
      }
    }
    if(status === 'Matched') diff = r2(pAmt - rAmt);

    results.push(mkResult({
      gk: gk, revId: lead2.revId, lead: lead2, g: g,
      pAmt: pAmt, bAmt: bAmt, rAmt: rAmt, diff: diff,
      status: status, matchType: matchType, rule: rule, reason: reason,
      flags: fl, slaDelay: slaMax, penal: penalTotal, today: today, ageing: ageing
    }));
  });

  results.sort(function(a, b){ return String(a.challan).localeCompare(String(b.challan)); });
  results.forEach(function(r, i){ r.id = 'RCN-2026-' + pad(i + 1, 6); });
  return { results: results, penalties: penalties, summary: summarise(results, penalties) };
}

function mkResult(o){
  var g = o.g, lead = o.lead || {};
  var bankLeg = g.B[0] || {}, rbiLeg = g.R[0] || {};
  var ageing = (o.ageing !== undefined) ? o.ageing :
               (dayDiff(lead.payment_date || bankLeg.payment_received_date || rbiLeg.rbi_credit_date, o.today) || 0);
  return {
    id: '', gk: o.gk, revId: o.revId,
    source: lead.revenue_source || bankLeg.revenue_source || rbiLeg.revenue_source || '',
    dept: lead.department_code || bankLeg.department_code || rbiLeg.department_code || '',
    pao: lead.pao_code || bankLeg.pao_code || rbiLeg.pao_code || '',
    ddo: lead.ddo_code || '',
    challan: lead.challan_no || bankLeg.challan_no || rbiLeg.challan_no || '',
    cin: lead.cin || bankLeg.cin || rbiLeg.cin || '',
    cpin: lead.cpin || bankLeg.cpin || '',
    payer: lead.payer_name || bankLeg.payer_name || '',
    payerId: lead.payer_id || bankLeg.payer_id || '',
    head: lead.receipt_head || bankLeg.receipt_head || rbiLeg.receipt_head || '',
    mode: lead.payment_mode || bankLeg.payment_mode || '',
    bank: bankLeg.bank_code || rbiLeg.bank_code || '',
    branch: bankLeg.branch_code || '',
    portalAmt: r2(o.pAmt), bankAmt: r2(o.bAmt), rbiAmt: r2(o.rAmt), diff: r2(o.diff),
    portalDate: lead.payment_date || '', bankDate: bankLeg.bank_remittance_date || '',
    realDate: bankLeg.instrument_realization_date || '',
    rbiDate: rbiLeg.rbi_credit_date || '',
    matchType: o.matchType, status: o.status, machineStatus: o.status, rule: o.rule,
    reason: o.reason, flags: o.flags || [], slaDelay: o.slaDelay || 0, penal: r2(o.penal || 0),
    ageing: ageing, assigned: '', booking: (o.status === 'Matched') ? 'Ready for Booking' : 'Blocked',
    voucher: '', override: null, notes: [], docs: [], resolution: '',
    portalIds: g.P.map(function(r){ return r.__id; }),
    bankIds: g.B.map(function(r){ return r.__id; }),
    rbiIds: g.R.map(function(r){ return r.__id; }),
    scrolls: g.B.map(function(r){ return r.scroll_no; }).filter(Boolean).join(', '),
    rbiFiles: g.R.map(function(r){ return r.rbi_file_no; }).filter(Boolean).join(', '),
    utrs: g.B.map(function(r){ return r.utr_no; }).filter(Boolean).join(', ')
  };
}

function summarise(res, pen){
  var s = { total: res.length, amount: 0, byStatus: {}, matched: 0, matchedAmt: 0,
            pending: 0, pendingAmt: 0, suspense: 0, suspenseAmt: 0, rat: 0, ratAmt: 0,
            mismatch: 0, mismatchAmt: 0, dup: 0, dupAmt: 0, inv: 0, invAmt: 0,
            lateCount: 0, penal: 0 };
  res.forEach(function(r){
    var amt = r.portalAmt > 0 ? r.portalAmt : (r.rbiAmt || r.bankAmt);
    s.amount = r2(s.amount + amt);
    s.byStatus[r.status] = (s.byStatus[r.status] || 0) + 1;
    if(r.status === 'Matched'){ s.matched++; s.matchedAmt = r2(s.matchedAmt + amt); }
    if(r.status === 'Pending'){ s.pending++; s.pendingAmt = r2(s.pendingAmt + amt); }
    if(r.status === 'Suspend'){ s.suspense++; s.suspenseAmt = r2(s.suspenseAmt + amt); }
    if(r.status === 'RAT'){ s.rat++; s.ratAmt = r2(s.ratAmt + amt); }
    if(r.status === 'Mismatch'){ s.mismatch++; s.mismatchAmt = r2(s.mismatchAmt + Math.abs(r.diff)); }
    if(r.status === 'Duplicate'){ s.dup++; s.dupAmt = r2(s.dupAmt + Math.abs(r.diff)); }
    if(r.status === 'Under Investigation'){ s.inv++; s.invAmt = r2(s.invAmt + amt); }
    if(r.slaDelay > 0) s.lateCount++;
  });
  pen.forEach(function(p){ s.penal = r2(s.penal + p.penal); });
  return s;
}

/* ---------- exception generation ---------- */
function excCategory(r){
  if(r.status === 'Duplicate') return 'Duplicate transaction';
  if(r.status === 'RAT') return 'Unidentified RBI credit / RAT';
  if(r.status === 'Mismatch') return 'Amount mismatch';
  if(r.status === 'Suspend') return (r.bankAmt > 0) ? 'RBI record missing' : 'Suspense / portal greater than RBI';
  if(r.status === 'Under Investigation') return (r.matchType === 'Attribute Conflict') ? 'Department / PAO mismatch' : 'Date mismatch';
  return 'Delayed bank remittance';
}
function excSeverity(r, cat){
  if(cat === 'Duplicate transaction') return 'Critical';
  if(cat === 'Amount mismatch') return Math.abs(r.diff) >= 1000 ? 'High' : 'Medium';
  if(cat === 'Unidentified RBI credit / RAT') return 'High';
  if(cat === 'Delayed bank remittance') return r.penal >= 1 ? 'Medium' : 'Low';
  return 'Medium';
}
function buildExceptions(res){
  var out = [], cfg = M().config, n = 0;
  function add(r, cat, sev, det){
    n++;
    out.push({
      id: 'EXC-2026-' + pad(n, 5), reconId: r.id, revId: r.revId, category: cat, severity: sev,
      source: r.source, dept: r.dept, pao: r.pao, bank: r.bank, challan: r.challan, cin: r.cin,
      payer: r.payer, amount: Math.abs(r.diff) > 0 ? Math.abs(r.diff) : (r.portalAmt || r.rbiAmt || r.bankAmt),
      grossAmount: r.portalAmt || r.rbiAmt || r.bankAmt,
      raisedOn: bizDate(), due: addDays(bizDate(), num(cfg.escalationDays)), ageing: r.ageing,
      status: 'Open', assigned: '', escalated: false, detail: det, comments: [], resolution: '', closedOn: ''
    });
  }
  res.forEach(function(r){
    if(r.status !== 'Matched' && r.status !== 'Pending'){
      var cat = excCategory(r);
      add(r, cat, excSeverity(r, cat), r.reason);
    }
    if(r.slaDelay > 0){
      add(r, 'Delayed bank remittance', excSeverity(r, 'Delayed bank remittance'),
          'Agency bank ' + bankName(r.bank) + ' remitted ' + money(r.bankAmt) + ' with a delay of ' + r.slaDelay +
          ' day(s) beyond the permitted SLA. Penal interest computed: ' + money(r.penal) + '.');
    }
    if(r.head && !findBy(M().heads, 'code', r.head)){
      add(r, 'Invalid receipt head', 'High', 'Receipt head ' + r.head + ' does not exist in the active receipt-head master.');
    }
  });
  /* invalid upload rows carried forward from rejected validation */
  (DB.invalidRows || []).forEach(function(iv){
    n++;
    out.push({
      id: 'EXC-2026-' + pad(n, 5), reconId: '', revId: '', category: 'Invalid upload record', severity: 'Medium',
      source: iv.source || '', dept: iv.dept || '', pao: iv.pao || '', bank: '', challan: iv.challan || '', cin: '',
      payer: iv.payer || '', amount: num(iv.amount), grossAmount: num(iv.amount),
      raisedOn: bizDate(), due: addDays(bizDate(), num(cfg.escalationDays)), ageing: 0,
      status: 'Open', assigned: '', escalated: false,
      detail: 'Upload ' + iv.batch + ' row ' + iv.line + ' rejected: ' + iv.errors.join('; '),
      comments: [], resolution: '', closedOn: ''
    });
  });
  return out;
}

/* ---------- commit ---------- */
function commitRecon(out, scopeLabel){
  DB.recon = out.results;
  DB.penalties = out.penalties.map(function(p){
    var old = null;
    (DB.penalties || []).forEach(function(o){ if(o.id === p.id) old = o; });
    p.letterStatus = old ? old.letterStatus : 'Not Issued';
    p.letterNo = old ? old.letterNo : '';
    p.letterDate = old ? old.letterDate : '';
    p.bankResponse = old ? old.bankResponse : '';
    p.recovered = old ? old.recovered : 0;
    p.waived = old ? old.waived : 0;
    p.waiverRemark = old ? old.waiverRemark : '';
    return p;
  });
  var prevExc = {};
  (DB.exceptions || []).forEach(function(e){ prevExc[e.category + '|' + e.challan + '|' + e.revId] = e; });
  DB.exceptions = buildExceptions(out.results).map(function(e){
    var old = prevExc[e.category + '|' + e.challan + '|' + e.revId];
    if(old){
      e.status = old.status; e.assigned = old.assigned; e.escalated = old.escalated;
      e.comments = old.comments; e.resolution = old.resolution; e.closedOn = old.closedOn;
      e.due = old.due;
    }
    return e;
  });
  DB.reconRunAt = nowStamp();
  DB.reconScope = scopeLabel || 'All approved data';
  audit('Reconciliation', 'RECON_COMMIT', 'Reconciliation run', DB.reconRunAt, '',
        out.results.length + ' results / ' + DB.exceptions.length + ' exceptions',
        'Scope: ' + (scopeLabel || 'All approved data') + '. Matched ' + out.summary.matched +
        ', Suspend ' + out.summary.suspense + ', RAT ' + out.summary.rat +
        ', Mismatch ' + out.summary.mismatch + ', Duplicate ' + out.summary.dup +
        ', penal interest ' + money(out.summary.penal));
  if(out.summary.suspense || out.summary.rat || out.summary.mismatch || out.summary.dup){
    notify('Reconciliation exceptions raised',
           out.summary.suspense + ' suspense, ' + out.summary.rat + ' RAT, ' + out.summary.mismatch +
           ' mismatch and ' + out.summary.dup + ' duplicate case(s) require action.', 'warn');
  }
  save();
}
function reconById(id){
  for(var i = 0; i < DB.recon.length; i++) if(DB.recon[i].id === id) return DB.recon[i];
  return null;
}
function recById(list, id){
  for(var i = 0; i < list.length; i++) if(list[i].__id === id) return list[i];
  return null;
}

    required: ['portal_name','revenue_source','department_code','pao_code','portal_transaction_id','payer_name','payment_date','payment_mode','amount','receipt_head','portal_status'],
    uniq: ['portal_transaction_id'],

  },

             'bank_reference_no','utr_no','payer_id','payer_name','payment_mode','payment_received_date','instrument_realization_date',
             'bank_remittance_date','amount','receipt_head','bank_status'],

function twoDec(v){
  var s = tx(v);
  if(s.indexOf('.') < 0) return true;
  return s.split('.')[1].length <= 2;
}
function existsIn(list, key, v){ return !!findBy(list, key, v); }

/* Validate one parsed dataset. Returns a full validation report. */
function validateUpload(kind, parsed, ctx){
  var spec = UPLOAD_SPEC[kind];
  var report = { kind: kind, headers: parsed.headers, total: parsed.rows.length,
                 valid: [], invalid: [], dupInFile: [], dupPosted: [], warnings: [],
                 controlTotal: 0, missingHeaders: [], extraHeaders: [] };
  spec.fields.forEach(function(f){ if(parsed.headers.indexOf(f) < 0) report.missingHeaders.push(f); });
  parsed.headers.forEach(function(h){ if(spec.fields.indexOf(h) < 0 && h) report.extraHeaders.push(h); });

  var seen = {}, postedKeys = {};
  DB[spec.store].forEach(function(r){ spec.uniq.forEach(function(u){ if(nrm(r[u])) postedKeys[nrm(r[u])] = r.batch; }); });

  parsed.rows.forEach(function(row){
    var errs = [], warns = [];

    spec.required.forEach(function(f){
      if(tx(row[f]) === '') errs.push('Required field "' + f + '" is empty');
    });
    /* amount */
    var raw = tx(row.amount);
    if(raw === ''){ /* already reported */ }
    else if(!/^-?\d+(\.\d+)?$/.test(raw.replace(/,/g, ''))) errs.push('Amount "' + raw + '" is not numeric');
    else if(num(raw) <= 0) errs.push('Amount must be greater than zero');
    else if(!twoDec(raw)) errs.push('Amount has more than two decimal places');
    /* dates */
    spec.dateFields.forEach(function(f){
      if(tx(row[f]) !== '' && !validDate(row[f])) errs.push('Field "' + f + '" is not a valid ISO date (' + tx(row[f]) + ')');
    });
    /* master validations */
    if(tx(row.revenue_source) && !existsIn(M().sources, 'code', row.revenue_source)) errs.push('Revenue source "' + tx(row.revenue_source) + '" is not an active master value');
    if(tx(row.department_code) && !existsIn(M().departments, 'code', row.department_code)) errs.push('Department "' + tx(row.department_code) + '" is not an active master value');
    if(tx(row.pao_code) && !existsIn(M().paos, 'code', row.pao_code)) errs.push('PAO "' + tx(row.pao_code) + '" is not an active master value');
    if(tx(row.ddo_code) && !existsIn(M().ddos, 'code', row.ddo_code)) errs.push('DDO "' + tx(row.ddo_code) + '" is not an active master value');
    if(tx(row.receipt_head) && !existsIn(M().heads, 'code', row.receipt_head)) errs.push('Receipt head "' + tx(row.receipt_head) + '" is not in the receipt-head master');
    if(tx(row.payment_mode) && PAY_MODES.indexOf(up(row.payment_mode)) < 0) errs.push('Payment mode "' + tx(row.payment_mode) + '" is not supported');
    if(tx(row.bank_code) && !existsIn(M().banks, 'code', row.bank_code)) errs.push('Bank "' + tx(row.bank_code) + '" is not an active master value');
    if(tx(row.branch_code) && !existsIn(M().branches, 'code', row.branch_code)) warns.push('Branch "' + tx(row.branch_code) + '" is not in the branch master');
    if(kind === 'portal' && tx(row.portal_name) && !existsIn(M().portals, 'code', row.portal_name)) errs.push('Portal "' + tx(row.portal_name) + '" is not a registered revenue portal');
    /* source ↔ head mapping */
    var hd = findBy(M().heads, 'code', row.receipt_head);
    if(hd && tx(row.revenue_source) && nrm(hd.source) !== nrm(row.revenue_source))
      errs.push('Receipt head ' + tx(row.receipt_head) + ' is mapped to revenue source ' + hd.source + ', not ' + tx(row.revenue_source));
    /* department / PAO vs revenue-source configuration (advisory) */
    var sc = findBy(M().sources, 'code', row.revenue_source);
    if(sc && tx(row.department_code) && nrm(sc.dept) !== nrm(row.department_code))
      warns.push('Department ' + tx(row.department_code) + ' differs from the revenue-source configuration (' + sc.dept + ') — permitted for shared collecting departments but recorded for review');
    if(sc && tx(row.pao_code) && nrm(sc.pao) !== nrm(row.pao_code))
      warns.push('PAO ' + tx(row.pao_code) + ' differs from the revenue-source configuration (' + sc.pao + ')');
    /* unique identifier requirement */
    if(kind === 'portal' && !tx(row.portal_transaction_id) && !tx(row.challan_no) && !tx(row.cpin) && !tx(row.cin))
      errs.push('At least one unique payment identifier (portal transaction ID / challan no / CPIN / CIN) is required');
    if(kind === 'bank' && !tx(row.bank_reference_no) && !tx(row.utr_no) && !tx(row.challan_no) && !tx(row.cin))
      errs.push('At least one of bank reference no / UTR / challan no / CIN is required');
    if(kind === 'rbi' && !tx(row.challan_no) && !tx(row.cin) && !tx(row.bank_reference_no) && !tx(row.utr_no))
      errs.push('At least one matching identifier (challan no / CIN / bank reference / UTR) is required');
    /* instrument realisation */
    if(kind === 'bank'){
      var m = up(row.payment_mode);
      if((m === 'CHEQUE' || m === 'DD') && !validDate(row.instrument_realization_date))
        errs.push('Cheque / DD scroll line requires a valid instrument realisation date before remittance SLA can be computed');
      if(validDate(row.payment_received_date) && validDate(row.bank_remittance_date) &&
         row.bank_remittance_date < row.payment_received_date)
        errs.push('Bank remittance date is earlier than the payment received date');
    }
    if(kind === 'rbi' && validDate(row.rbi_credit_date) && validDate(row.rbi_file_date) && row.rbi_credit_date > addDays(row.rbi_file_date, 7))
      warns.push('RBI credit date is more than 7 days from the luggage file date');

    /* duplicates */
    var dupMsg = '';
    spec.uniq.forEach(function(u){
      var k = nrm(row[u]); if(!k) return;
      if(seen[k]) dupMsg = 'Duplicate "' + u + '" value ' + tx(row[u]) + ' also present on line ' + seen[k] + ' of this file';
      else seen[k] = row.__line;
      if(postedKeys[k]) dupMsg = 'Duplicate "' + u + '" value ' + tx(row[u]) + ' already posted under batch ' + postedKeys[k];
    });

    var rec = { line: row.__line, data: row, errors: errs, warnings: warns, dup: dupMsg };
    if(errs.length) report.invalid.push(rec);
    else if(dupMsg) report.dupInFile.push(rec);
    else { report.valid.push(rec); report.controlTotal = r2(report.controlTotal + num(row.amount)); }
    if(warns.length) report.warnings.push(rec);
  });
  report.ctx = ctx || {};
  return report;
}

/* Post a validated dataset as an upload batch awaiting checker approval. */
function postBatch(kind, report, ctx, autoApprove){
  var spec = UPLOAD_SPEC[kind];
  var no = newBatchNo(kind);
  var batch = {
    no: no, kind: kind, kindLabel: spec.title, file: ctx.fileName || spec.file,
    size: ctx.fileSize || (SAMPLE_CSV[kind] ? SAMPLE_CSV[kind].text.length : 0),
    uploadedBy: curUser(), uploadedRole: roleName(ROLE), uploadedAt: nowStamp(),
    records: report.valid.length, amount: report.controlTotal,
    status: 'Pending Checker Approval', checker: '', checkedAt: '', remarks: '',
    errorCount: report.invalid.length, dupCount: report.dupInFile.length,
    totalRows: report.total, dept: ctx.dept || '', pao: ctx.pao || '', source: ctx.source || '',
    bank: ctx.bank || '', period: ctx.period || '', origin: ctx.origin || 'CSV upload'
  };
  DB.batches.unshift(batch);
  report.valid.forEach(function(v){
    var o = {};
    spec.fields.forEach(function(f){ o[f] = tx(v.data[f]); });
    o.__id = spec.idPfx + '-' + pad(nextSeq(spec.idPfx), 6);
    o.batch = no;
    o.line = v.line;
    if(kind === 'portal'){
      o.revId = newRevId();
      o.deptValidated = false;
      o.entryMode = ctx.origin === 'Manual entry' ? 'Manual' : 'CSV';
      o.bookingStatus = 'Not Booked';
    }
    DB[spec.store].push(o);
  });
  DB.invalidRows = DB.invalidRows || [];
  report.invalid.forEach(function(iv){
    DB.invalidRows.push({
      batch: no, line: iv.line, errors: iv.errors, kind: kind,
      source: tx(iv.data.revenue_source), dept: tx(iv.data.department_code), pao: tx(iv.data.pao_code),
      challan: tx(iv.data.challan_no), payer: tx(iv.data.payer_name), amount: tx(iv.data.amount)
    });
  });
  audit('Data Upload', 'BATCH_POST', 'Upload batch', no, '',
        report.valid.length + ' valid / ' + report.invalid.length + ' invalid / ' + report.dupInFile.length + ' duplicate',
        spec.title + ' — file ' + batch.file + ', control total ' + money(report.controlTotal));
  notify('Upload batch ' + no + ' posted',
         report.valid.length + ' record(s) totalling ' + money(report.controlTotal) + ' awaiting PAO Checker approval.', 'info');
  if(autoApprove){
    batch.status = 'Approved'; batch.checker = ctx.checker || 'system.init';
    batch.checkedAt = nowStamp(); batch.remarks = ctx.remarks || 'Auto-approved during demo data initialisation';
    audit('Data Upload', 'BATCH_APPROVE', 'Upload batch', no, 'Pending Checker Approval', 'Approved', batch.remarks);
  }
  save();
  return batch;
}

function approveBatch(no, ok, remarks){
  var b = null;
  DB.batches.forEach(function(x){ if(x.no === no) b = x; });
  if(!b) return;
  var old = b.status;
  b.status = ok ? 'Approved' : 'Rejected';
  b.checker = curUser(); b.checkedAt = nowStamp(); b.remarks = remarks || '';
  audit('Data Upload', ok ? 'BATCH_APPROVE' : 'BATCH_REJECT', 'Upload batch', no, old, b.status, remarks || '');
  notify('Batch ' + no + ' ' + (ok ? 'approved' : 'rejected'),
         (ok ? 'The batch will now participate in official reconciliation.' : 'The batch is excluded from reconciliation.'), ok ? 'ok' : 'warn');
  save();
}
function deleteBatch(no){
  var b = null;
  DB.batches.forEach(function(x){ if(x.no === no) b = x; });
  if(!b) return;
  var spec = UPLOAD_SPEC[b.kind];
  var before = DB[spec.store].length;
  DB[spec.store] = DB[spec.store].filter(function(r){ return r.batch !== no; });
  DB.invalidRows = (DB.invalidRows || []).filter(function(r){ return r.batch !== no; });
  DB.batches = DB.batches.filter(function(x){ return x.no !== no; });
  audit('Data Upload', 'BATCH_DELETE', 'Upload batch', no, before + ' records', DB[spec.store].length + ' records',
        'Batch and its source records removed');
  save();
}

  return {

    dept: tx(r.department_code), pao: tx(r.pao_code), ddo: tx(r.ddo_code),
    origChallan: tx(r.original_challan_no), origHead: tx(r.original_receipt_head),

    stage: stageIndexFor(up(r.refund_type), tx(r.status)), pendingAt: pendingRoleFor(up(r.refund_type), tx(r.status)),

    billNo: '', billDate: '', approvedBy: '', approvedOn: '', rejectReason: '', deficiency: '', overrideRemark: '', closedOn: ''
  };
}
function mkClaim(r){
  return {
    claimNo: tx(r.claim_no), body: tx(r.local_body_code), bodyName: tx(r.local_body_name),
    source: tx(r.revenue_source), head: tx(r.receipt_head), from: tx(r.claim_period_from), to: tx(r.claim_period_to),
    claimAmount: num(r.claim_amount), basis: tx(r.calculation_basis), status: tx(r.status) || 'Submitted',
    submitted: tx(r.submitted_date), computed: 0, eligible: 0, variance: 0, approvedAmount: 0,
    payStatus: 'Not Paid', payRef: '', payDate: '', adviceNo: '', approvedBy: '', approvedOn: '',
    history: [{ ts: nowStamp(), by: 'system.init', act: 'Claim imported from sample file', note: '' }], remark: ''
  };
}
function stageIndexFor(type, status){
  var s = tx(status).toLowerCase();
  if(type === 'JUDICIAL_STAMP'){
    if(s.indexOf('court order') >= 0) return 1;
    return 0;
  }
  if(s.indexOf('verification') >= 0) return 2;
  return 0;
}
function pendingRoleFor(type, status){
  var s = tx(status).toLowerCase();
  if(s.indexOf('court order') >= 0) return 'Finance Department User';
  if(s.indexOf('verification') >= 0) return 'DDO / Department User';
  return 'DDO / Department User';
}

/* delegated binding for data-act buttons declared by screens */
var ACTIONS = {};
function bindAll(root){
  root.querySelectorAll('[data-act]').forEach(function(el){
    if(el.__bound) return;
    el.__bound = true;
    el.onclick = function(e){
      e.preventDefault();
      var spec = this.getAttribute('data-act');
      var p = spec.split('|');
      var fn = ACTIONS[p[0]];
      if(fn) fn.apply(null, p.slice(1).concat([this]));
      else console.warn('No action handler for', p[0]);
    };
  });
  root.querySelectorAll('[data-chg]').forEach(function(el){
    if(el.__bound2) return;
    el.__bound2 = true;
    el.onchange = function(){
      var p = this.getAttribute('data-chg').split('|');
      var fn = ACTIONS[p[0]];
      if(fn) fn.apply(null, p.slice(1).concat([this]));
    };
  });
}

  s.rbiCount = DB.rbi.length;

var COLF = { from:'', to:'', dept:'', pao:'', ddo:'', source:'', bank:'', mode:'', status:'', min:'', max:'' };

function reconForPortal(p){
  for(var i = 0; i < DB.recon.length; i++) if(DB.recon[i].portalIds.indexOf(p.__id) >= 0) return DB.recon[i];
  return null;
}
function bankLegsFor(r){ return (r ? r.bankIds : []).map(function(id){ return recById(DB.bank, id); }).filter(Boolean); }
function rbiLegsFor(r){ return (r ? r.rbiIds : []).map(function(id){ return recById(DB.rbi, id); }).filter(Boolean); }
function batchOf(no){ var b = null; DB.batches.forEach(function(x){ if(x.no === no) b = x; }); return b; }

function collectionRows(){
  return DB.portal.filter(function(p){
    if(COLF.from && p.payment_date < COLF.from) return false;
    if(COLF.to && p.payment_date > COLF.to) return false;
    if(COLF.dept && nrm(p.department_code) !== nrm(COLF.dept)) return false;
    if(COLF.pao && nrm(p.pao_code) !== nrm(COLF.pao)) return false;
    if(COLF.ddo && nrm(p.ddo_code) !== nrm(COLF.ddo)) return false;
    if(COLF.source && nrm(p.revenue_source) !== nrm(COLF.source)) return false;
    if(COLF.mode && nrm(p.payment_mode) !== nrm(COLF.mode)) return false;
    if(COLF.min !== '' && num(p.amount) < num(COLF.min)) return false;
    if(COLF.max !== '' && num(p.amount) > num(COLF.max)) return false;
    var rc = reconForPortal(p);
    if(COLF.status && (rc ? rc.status : 'Pending') !== COLF.status) return false;
    if(COLF.bank){
      var legs = bankLegsFor(rc);
      if(!legs.some(function(b){ return nrm(b.bank_code) === nrm(COLF.bank); })) return false;
    }
    return true;
  }).map(function(p){
    var rc = reconForPortal(p);
    var legs = bankLegsFor(rc), rl = rbiLegsFor(rc);
    return {
      p: p, rc: rc,
      bankStatus: legs.length ? (legs[0].bank_status || 'REMITTED') : 'Not Received',
      rbiStatus: rl.length ? (rl[0].rbi_status || 'CONFIRMED') : 'Not Credited',
      reconStatus: rc ? rc.status : 'Pending',
      booking: rc ? (rc.voucher ? 'Booked' : rc.booking) : 'Blocked',
      bank: legs.length ? legs[0].bank_code : ''
    };
  });
}

function evidenceCol(title, rows, obj, missingMsg){
  var h = '<div class="ev-col"><h5>' + esc(title) + '</h5><div class="body">';
  if(!obj){ h += '<div class="small muted">' + esc(missingMsg || 'No record available.') + '</div></div></div>'; return h; }
  h += '<dl class="kv" style="grid-template-columns:130px 1fr">';
  rows.forEach(function(r){
    var v = obj[r[1]];
    var disp = r[2] === 'money' ? money(v) : r[2] === 'date' ? fmtDateDash(v) : dash(v);
    h += '<dt>' + esc(r[0]) + '</dt><dd>' + disp + '</dd>';
  });
  h += '</dl></div></div>';
  return h;
}
function txnTimeline(p, rc){
  var legs = bankLegsFor(rc), rl = rbiLegsFor(rc);
  var ev = [];
  var b = batchOf(p.batch);
  ev.push({ t:'Portal payment captured', d: p.payment_date, n: p.portal_name + ' — portal transaction ' + p.portal_transaction_id + ', mode ' + p.payment_mode + ', ' + money(p.amount), c:'ok' });
  if(b) ev.push({ t:'Source data uploaded (batch ' + b.no + ')', d: b.uploadedAt.slice(0, 10), n: b.file + ' uploaded by ' + b.uploadedBy + ' — status ' + b.status, c: b.status === 'Approved' ? 'ok' : 'warn' });
  legs.forEach(function(l){
    ev.push({ t:'Agency bank receipt — ' + bankName(l.bank_code), d: l.payment_received_date, n:'Scroll ' + l.scroll_no + ', bank reference ' + l.bank_reference_no + ', ' + money(l.amount), c:'ok' });
    if(validDate(l.instrument_realization_date))
      ev.push({ t:'Instrument realised', d: l.instrument_realization_date, n:'Cheque / DD realised at ' + bankName(l.bank_code), c:'ok' });
    var s = slaForBankLeg(l);
    ev.push({ t:'Remitted to Government account', d: l.bank_remittance_date,
              n:'UTR ' + l.utr_no + ' — ' + (s.delay > 0 ? s.delay + ' day(s) beyond SLA, penal interest ' + money(s.penal) : 'within SLA'),
              c: s.delay > 0 ? 'warn' : 'ok' });
  });
  rl.forEach(function(l){
    ev.push({ t:'RBI government-account credit confirmed', d: l.rbi_credit_date,
              n:'File ' + l.rbi_file_no + ', reference ' + l.rbi_reference_no + ', ' + money(l.amount) + ' to ' + l.government_account, c:'ok' });
  });
  if(rc) ev.push({ t:'Reconciliation outcome — ' + rc.status, d: DB.reconRunAt.slice(0, 10),
                   n: rc.matchType + ' under rule ' + rc.rule, c: rc.status === 'Matched' ? 'ok' : 'err' });
  if(rc && rc.voucher){
    var v = null; DB.vouchers.forEach(function(x){ if(x.no === rc.voucher) v = x; });
    if(v) ev.push({ t:'Receipt voucher ' + v.no + ' — ' + v.status, d: v.date, n:'Debit ' + v.debit + ' / Credit ' + v.credit + ' — ' + money(v.amount), c: v.status === 'Approved' ? 'ok' : 'warn' });
  }
  ev.sort(function(a, b2){ return String(a.d).localeCompare(String(b2.d)); });
  return '<div class="timeline">' + ev.map(function(e){
    return '<div class="tl-item ' + e.c + '"><div class="tt">' + esc(e.t) + '</div><div class="small">' + esc(e.n) + '</div>' +
           '<div class="td">' + fmtDate(e.d) + '</div></div>';
  }).join('') + '</div>';
}

function wireTabs(root, tabsId){
  var tabs = root.querySelector('#' + tabsId);
  if(!tabs) return;
  tabs.querySelectorAll('[data-tt]').forEach(function(t){
    t.onclick = function(){
      tabs.querySelectorAll('[data-tt]').forEach(function(x){ x.classList.remove('active'); });
      this.classList.add('active');
      var want = this.getAttribute('data-tt');
      root.querySelectorAll('[data-tp]').forEach(function(p){ p.classList.toggle('hidden', p.getAttribute('data-tp') !== want); });
    };
  });
}

      fn:function(el, close){ saveManual(el, close, existing); } }]
  });

function saveManual(el, close, existing){
  function v(id){ return tx(el.querySelector('#' + id).value); }
  var row = {
    portal_name:v('mc_portal'), revenue_source:v('mc_src'), department_code:v('mc_dept'), pao_code:v('mc_pao'), ddo_code:v('mc_ddo'),
    portal_transaction_id:v('mc_ptxn'), challan_no:v('mc_ch'), cpin:v('mc_cpin'), cin:v('mc_cin'),
    payer_id:v('mc_pid'), payer_name:v('mc_pn'), payment_date:v('mc_pd'), service_date:v('mc_sd'),
    payment_mode:v('mc_mode'), amount:v('mc_amt'), receipt_head:v('mc_head'), service_description:v('mc_desc'),
    penalty_amount:v('mc_pen') || '0.00', portal_status:v('mc_ps'), __line:1
  };
  var rep = validateUpload('portal', { headers: UPLOAD_SPEC.portal.fields, rows: [row] }, {});
  if(rep.invalid.length){
    el.querySelector('#mc_err').innerHTML = '<div class="errbar mt8"><strong>Validation failed:</strong><ul class="mb0 mt4">' +
      rep.invalid[0].errors.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
    return;
  }
  if(rep.dupInFile.length && !existing){
    el.querySelector('#mc_err').innerHTML = '<div class="errbar mt8">' + esc(rep.dupInFile[0].dup) +
      ' — duplicate source transactions cannot be silently posted. Change the identifier or resolve the existing record from the exception register.</div>';
    return;
  }
  if(existing){
    var old = JSON.stringify({ amount: existing.amount, head: existing.receipt_head, mode: existing.payment_mode });
    UPLOAD_SPEC.portal.fields.forEach(function(f){ existing[f] = row[f]; });
    existing.pendingApproval = true;
    audit('Revenue Collection', 'COLLECTION_EDIT', 'Portal transaction', existing.revId, old,
          JSON.stringify({ amount: existing.amount, head: existing.receipt_head, mode: existing.payment_mode }),
          'Manual correction captured — awaiting PAO Checker approval');
    notify('Manual correction pending approval', existing.revId + ' was edited by ' + curUser() + ' and requires checker approval.', 'warn');
    toast('Record updated and routed for checker approval.', 'ok');
  }else{
    postBatch('portal', rep, { fileName:'manual-entry.csv', origin:'Manual entry', source: row.revenue_source,
      dept: row.department_code, pao: row.pao_code, period: row.payment_date }, false);
    toast('Manual collection posted to a new batch awaiting checker approval.', 'ok');
  }
  save(); close(); render();
}

function after_upload(){

    dz.ondrop = function(e){
      e.preventDefault(); this.classList.remove('over');
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(!f) return;
      if(!guard('upload.' + p.kind, 'upload ' + p.kind + ' data')) return;
      var rd = new FileReader();
      rd.onload = function(){ openUploadReview(p.kind, String(rd.result), f.name, f.size); };
      rd.readAsText(f);
    };
    dz.onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pickFile(p.kind); } };
  });
}
