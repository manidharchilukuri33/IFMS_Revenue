function openUploadReview(kind, text, fileName, fileSize, isDemo){
  var spec = UPLOAD_SPEC[kind];
  var parsed = csvToObjects(text);
  var rep = validateUpload(kind, parsed, {});
  var h = '';
  h += '<div class="grid g4 mb12">';
  h += kpi('', 'Total records', cnt(rep.total), esc(fileName));
  h += kpi('ok', 'Valid records', cnt(rep.valid.length), 'Ready to post');
  h += kpi('err', 'Invalid records', cnt(rep.invalid.length), 'Rejected with reasons');
  h += kpi('warn', 'Duplicate records', cnt(rep.dupInFile.length), 'Require an explicit decision');
  h += '</div>';
  h += '<div class="box info mb12"><dl class="kv" style="grid-template-columns:160px 1fr">' +
       '<dt>File name</dt><dd class="mono">' + esc(fileName) + '</dd>' +
       '<dt>File size</dt><dd>' + cnt(fileSize) + ' bytes</dd>' +
       '<dt>Dataset</dt><dd>' + esc(spec.title) + '</dd>' +
       '<dt>Detected headers</dt><dd class="tiny mono">' + esc(parsed.headers.join(', ')) + '</dd>' +
       '<dt>Control total (valid rows)</dt><dd class="strong">' + money(rep.controlTotal) + '</dd>' +
       '</dl></div>';
  if(rep.missingHeaders.length)
    h += '<div class="errbar">Missing expected column(s): <span class="mono">' + esc(rep.missingHeaders.join(', ')) + '</span>. Rows referencing these fields will fail validation.</div>';
  if(rep.extraHeaders.length)
    h += '<div class="warnbar"><span>&#9888;</span><div>Unrecognised column(s) will be ignored: <span class="mono">' + esc(rep.extraHeaders.join(', ')) + '</span></div></div>';

  h += '<h4 class="mb8">Upload context</h4>';
  h += '<div class="grid g4 mb12">';
  h += '<div class="fld"><label>Department</label><select class="inp" id="uc_dept">' + optList(M().departments, 'code', 'name', '', 'From file') + '</select></div>';
  h += '<div class="fld"><label>PAO</label><select class="inp" id="uc_pao">' + optList(M().paos, 'code', 'name', '', 'From file') + '</select></div>';
  h += '<div class="fld"><label>Revenue source</label><select class="inp" id="uc_src">' + optList(M().sources, 'code', 'name', '', 'From file') + '</select></div>';
  if(kind !== 'portal')
    h += '<div class="fld"><label>Agency bank</label><select class="inp" id="uc_bank">' + optList(M().banks, 'code', 'name', '', 'From file') + '</select></div>';
  h += '<div class="fld"><label>Data date / period</label><input type="date" class="inp" id="uc_period" value="' + esc(bizDate()) + '"></div>';
  h += '</div>';

  h += '<h4 class="mb8">Preview — first 10 records</h4><div class="tbl-wrap mb12"><table class="dt"><thead><tr><th>Row</th>' +
       parsed.headers.slice(0, 12).map(function(x){ return '<th>' + esc(x) + '</th>'; }).join('') + '<th>Validation</th></tr></thead><tbody>';
  parsed.rows.slice(0, 10).forEach(function(row){
    var st = '<span class="badge b-green">Valid</span>';
    rep.invalid.forEach(function(i){ if(i.line === row.__line) st = '<span class="badge b-red">Invalid</span>'; });
    rep.dupInFile.forEach(function(i){ if(i.line === row.__line) st = '<span class="badge b-amber">Duplicate</span>'; });
    h += '<tr><td class="num">' + row.__line + '</td>' +
         parsed.headers.slice(0, 12).map(function(x){ return '<td class="tiny">' + dash(row[x]) + '</td>'; }).join('') +
         '<td>' + st + '</td></tr>';
  });
  h += '</tbody></table></div>';

  if(rep.invalid.length){
    h += '<h4 class="mb8">Validation errors (' + rep.invalid.length + ')</h4><div class="box err mb12" style="max-height:200px;overflow:auto">';
    rep.invalid.forEach(function(i){
      h += '<div class="small mb4"><strong>Row ' + i.line + ':</strong> ' + esc(i.errors.join('; ')) + '</div>';
    });
    h += '</div>';
  }
  if(rep.dupInFile.length){
    h += '<h4 class="mb8">Duplicate source transactions (' + rep.dupInFile.length + ')</h4><div class="box warn mb12">' +
         '<div class="small mb8">Duplicate source transactions are never posted silently. They are held here and appear in the exception register until an explicit decision is recorded.</div>';
    rep.dupInFile.forEach(function(i){ h += '<div class="small mb4"><strong>Row ' + i.line + ':</strong> ' + esc(i.dup) + '</div>'; });
    h += '</div>';
  }
  if(rep.warnings.length){
    h += '<h4 class="mb8">Advisory warnings (' + rep.warnings.length + ')</h4><div class="box mb12" style="max-height:160px;overflow:auto">';
    rep.warnings.forEach(function(i){ h += '<div class="small mb4"><strong>Row ' + i.line + ':</strong> ' + esc(i.warnings.join('; ')) + '</div>'; });
    h += '</div>';
  }

  var btns = [{ label:'Cancel' }];
  if(rep.valid.length){
    btns.push({ label:'Post ' + rep.valid.length + ' record(s) for Approval', cls:'btn-p', fn:function(el){
      var ctx = {
        fileName: fileName, fileSize: fileSize, origin: isDemo ? 'Included demo dataset' : 'CSV upload',
        dept: el.querySelector('#uc_dept').value, pao: el.querySelector('#uc_pao').value,
        source: el.querySelector('#uc_src').value,
        bank: el.querySelector('#uc_bank') ? el.querySelector('#uc_bank').value : '',
        period: el.querySelector('#uc_period').value
      };
      var b = postBatch(kind, rep, ctx, false);
      toast('Batch ' + b.no + ' posted — ' + rep.valid.length + ' record(s) awaiting PAO Checker approval.', 'ok');
      render();
    }});
  }
  modal({ title:'Validate & post — ' + spec.title, sub: fileName + ' (' + cnt(fileSize) + ' bytes)', width:'w1100', body: h, buttons: btns });
}

var RCF = { source:'', pao:'', dept:'', bank:'', from:'', to:'', status:'', matchType:'', flag:'' };
var RC_PREVIEW = null;

function reconRows(){
  return DB.recon.filter(function(r){
    if(RCF.source && nrm(r.source) !== nrm(RCF.source)) return false;
    if(RCF.pao && nrm(r.pao) !== nrm(RCF.pao)) return false;
    if(RCF.dept && nrm(r.dept) !== nrm(RCF.dept)) return false;
    if(RCF.bank && nrm(r.bank) !== nrm(RCF.bank)) return false;
    if(RCF.status && r.status !== RCF.status) return false;
    if(RCF.matchType && r.matchType !== RCF.matchType) return false;
    if(RCF.flag === 'late' && !(r.slaDelay > 0)) return false;
    if(RCF.flag === 'override' && !r.override) return false;
    if(RCF.from && r.portalDate && r.portalDate < RCF.from) return false;
    if(RCF.to && r.portalDate && r.portalDate > RCF.to) return false;
    return true;
  });
}
function scopeFromFilters(){
  var s = {};
  if(RCF.source) s.source = RCF.source;
  if(RCF.pao) s.pao = RCF.pao;
  if(RCF.dept) s.dept = RCF.dept;
  if(RCF.bank) s.bank = RCF.bank;
  if(RCF.from) s.from = RCF.from;
  if(RCF.to) s.to = RCF.to;
  return Object.keys(s).length ? s : null;
}
function scopeLabel(s){
  if(!s) return 'All approved data';
  var p = [];
  if(s.source) p.push('source ' + s.source);
  if(s.dept) p.push('department ' + s.dept);
  if(s.pao) p.push('PAO ' + s.pao);
  if(s.bank) p.push('bank ' + s.bank);
  if(s.from) p.push('from ' + fmtDate(s.from));
  if(s.to) p.push('to ' + fmtDate(s.to));
  return p.join(', ');
}

/* ---------- run / preview / commit ---------- */
function doRunRecon(scoped){
  if(!guard('recon.run', 'run reconciliation')) return;
  var scope = scoped ? scopeFromFilters() : null;
  var appr = DB.batches.filter(function(b){ return b.status === 'Approved'; });
  if(!appr.length){
    toast('No approved upload batch exists. Approve a batch in the Data Upload Centre first.', 'err');
    return;
  }
  var out = runRecon(scope);
  confirmDlg('Commit reconciliation results',
    '<div class="small mb8">Scope: <strong>' + esc(scopeLabel(scope)) + '</strong> &middot; approved batches: <strong>' + appr.length + '</strong> &middot; demo business date: <strong>' + fmtDate(bizDate()) + '</strong></div>' +
    '<div class="grid g3">' +
      kpi('ok', 'Matched', cnt(out.summary.matched), compact(out.summary.matchedAmt)) +
      kpi('warn', 'Suspend / Pending', cnt(out.summary.suspense + out.summary.pending), compact(r2(out.summary.suspenseAmt + out.summary.pendingAmt))) +
      kpi('err', 'Exceptions', cnt(out.summary.mismatch + out.summary.dup + out.summary.rat + out.summary.inv), 'Mismatch / duplicate / RAT / investigation') +
    '</div>' +
    '<p class="small mt8 mb0">Committing replaces the previous reconciliation result set. Manual resolution states recorded on existing exceptions are preserved. Penal interest of <strong>' +
    money(out.summary.penal) + '</strong> will be raised across <strong>' + out.penalties.length + '</strong> delayed scroll line(s).</p>',
    function(){
      if(!guard('recon.commit', 'commit reconciliation results')) return;
      commitRecon(out, scopeLabel(scope));
      RC_PREVIEW = null;
      render();
      toast('Reconciliation committed — ' + out.results.length + ' result row(s), ' + DB.exceptions.length + ' exception(s).', 'ok');
    }, 'Commit results');
}
ACTIONS.reconRunScoped = function(){ doRunRecon(true); };
ACTIONS.reconPreview = function(){
  if(!guard('recon.run', 'preview reconciliation')) return;
  var scope = scopeFromFilters();

          'Scope: ' + esc(scopeLabel(scope)) + '. Demo business date ' + fmtDate(bizDate()) + '.</div>';

       kpi('vio', 'RAT', cnt(out.summary.rat), compact(out.summary.ratAmt)) +
       kpi('err', 'Mismatch / duplicate', cnt(out.summary.mismatch + out.summary.dup), compact(r2(out.summary.mismatchAmt + out.summary.dupAmt))) +
       '</div>';
  h += '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Challan</th><th>Source</th><th>Portal</th><th>Bank</th><th>RBI</th>' +
       '<th>Difference</th><th>Match type</th><th>Proposed status</th><th>Rule</th><th>Reason</th></tr></thead><tbody>';

    h += '<tr><td class="mono">' + esc(r.challan) + '</td><td>' + esc(r.source) + '</td>' +
         '<td class="num">' + money(r.portalAmt) + '</td><td class="num">' + money(r.bankAmt) + '</td><td class="num">' + money(r.rbiAmt) + '</td>' +

          render(); toast('Preview committed.', 'ok');
        }},
      { label:'Export preview', fn:function(){
          exportCSV('ifms_reconciliation_preview.csv',
            ['Challan', 'Source', 'Portal amount', 'Bank amount', 'RBI amount', 'Difference', 'Match type', 'Proposed status', 'Rule', 'Reason'],
            out.results.map(function(r){ return [r.challan, r.source, r.portalAmt, r.bankAmt, r.rbiAmt, r.diff, r.matchType, r.status, r.rule, r.reason]; }),
            [['Report', 'Reconciliation candidate preview'], ['Scope', scopeLabel(scope)]]);
        }}]
  });
};

       kpi('', 'Agency bank total', money(DB.bank.reduce(function(a, r){ return a + num(r.amount); }, 0)), cnt(DB.bank.length) + ' scroll lines') +

var EXC_CATEGORIES = [
  'Portal missing', 'Bank record missing', 'RBI record missing', 'Amount mismatch', 'Date mismatch',
  'Duplicate transaction', 'Invalid receipt head', 'Department / PAO mismatch', 'Delayed bank remittance',
  'Unidentified RBI credit / RAT', 'Suspense / portal greater than RBI', 'Invalid upload record',
  'Refund validation failure', 'Devolution claim variance'
];

function excRows(){
  return DB.exceptions.filter(function(e){
    if(EXCF.cat && e.category !== EXCF.cat) return false;
    if(EXCF.sev && e.severity !== EXCF.sev) return false;
    if(EXCF.dept && nrm(e.dept) !== nrm(EXCF.dept)) return false;
    if(EXCF.pao && nrm(e.pao) !== nrm(EXCF.pao)) return false;
    if(EXCF.source && nrm(e.source) !== nrm(EXCF.source)) return false;
    if(EXCF.bank && nrm(e.bank) !== nrm(EXCF.bank)) return false;
    if(EXCF.status && e.status !== EXCF.status) return false;
    if(EXCF.assigned && nrm(e.assigned).indexOf(nrm(EXCF.assigned)) < 0) return false;
    if(EXCF.age && num(e.ageing) < num(EXCF.age)) return false;
    if(EXCF.min !== '' && num(e.amount) < num(EXCF.min)) return false;
    return true;
  });
}

/* ===================== FRAGMENT 15: BANK SLA & PENAL INTEREST ===================== */

var SLAF = { bank:'', source:'', mode:'', status:'', minDelay:'' };

function penRows(){
  return DB.penalties.filter(function(p){
    if(SLAF.bank && nrm(p.bank) !== nrm(SLAF.bank)) return false;
    if(SLAF.source && nrm(p.source) !== nrm(SLAF.source)) return false;
    if(SLAF.mode && nrm(p.mode) !== nrm(SLAF.mode)) return false;
    if(SLAF.status && p.letterStatus !== SLAF.status) return false;
    if(SLAF.minDelay !== '' && num(p.delay) < num(SLAF.minDelay)) return false;
    return true;
  });
}
function penById(id){ var o = null; DB.penalties.forEach(function(p){ if(p.id === id) o = p; }); return o; }
function penOutstanding(p){ return r2(num(p.penal) - num(p.recovered) - num(p.waived)); }

function viewSLA(){
  var all = DB.penalties;
  var totalPenal = r2(all.reduce(function(a, p){ return a + num(p.penal); }, 0));
  var recovered = r2(all.reduce(function(a, p){ return a + num(p.recovered); }, 0));
  var waived = r2(all.reduce(function(a, p){ return a + num(p.waived); }, 0));
  var outstanding = r2(totalPenal - recovered - waived);
  var delayedAmt = r2(all.reduce(function(a, p){ return a + num(p.amount); }, 0));

  var h = crumb(['Bank SLA & Penal Interest']);
  h += pageHead('Bank Remittance SLA & Penal Interest',
    'Remittance performance of every agency-bank scroll line is measured from the payment received date (or the instrument realisation date for cheque / DD) to the bank remittance date, and compared with the configured SLA.',
    (can('penalty.letter') ? '<button class="btn btn-p btn-sm" data-act="penBulkLetters">&#9993; Generate letters for all recoverable cases</button>' : '') +
    '<button class="btn btn-sm" data-act="penOverdue">&#9202; Overdue recovery cases</button>' +
    '<button class="btn btn-sm" data-act="goto|masters">&#9881; SLA configuration</button>');

  h += '<div class="grid g4 mb16">';
  h += kpi('warn', 'Delayed scroll lines', cnt(all.length), compact(delayedAmt) + ' remitted late');
  h += kpi('err', 'Penal interest computed', money(totalPenal), 'at ' + plain(M().config.penalRate, 0) + '% p.a. simple daily');
  h += kpi('ok', 'Recovered', money(recovered), cnt(all.filter(function(p){ return p.letterStatus === 'Recovered'; }).length) + ' case(s) settled');
  h += kpi('vio', 'Outstanding / waived', money(outstanding), money(waived) + ' waived with approval');
  h += '</div>';

  h += '<div class="box info mb16 small"><strong>Prototype assumption:</strong> all calendar days are treated as working days. ' +
       'Penal interest = delayed amount &times; annual rate &times; delay days &divide; ' + M().config.penalDayBasis +
       '. SLA: online / UPI / card / net banking 1 day, cash 1 day, cheque / DD 1 day after realisation. Minimum recoverable threshold and rate are configurable in Masters &amp; Configuration.</div>';

  h += '<div class="card"><div class="card-h"><div><h3>Penal interest register</h3>' +
       '<div class="sub">Every calculation is shown transparently with principal, rate, delay days and formula</div></div>' +
       '<button class="btn btn-sm" data-act="slaClear">Clear filters</button></div>';
  h += '<div class="filterbar">';
  h += '<div class="fld"><label>Bank</label><select class="inp" data-chg="slaF|bank">' + optList(M().banks, 'code', 'name', SLAF.bank, 'All banks') + '</select></div>';
  h += '<div class="fld"><label>Revenue source</label><select class="inp" data-chg="slaF|source">' + optList(M().sources, 'code', 'name', SLAF.source, 'All sources') + '</select></div>';
  h += '<div class="fld"><label>Payment mode</label><select class="inp" data-chg="slaF|mode">' + optVals(PAY_MODES, SLAF.mode, 'All modes') + '</select></div>';
  h += '<div class="fld"><label>Recovery status</label><select class="inp" data-chg="slaF|status">' + optVals(['Not Issued', 'Issued', 'Recovered', 'Waived'], SLAF.status, 'All statuses') + '</select></div>';
  h += '<div class="fld"><label>Minimum delay (days)</label><input type="number" class="inp" data-chg="slaF|minDelay" value="' + esc(SLAF.minDelay) + '"></div>';
  h += '</div>';

  h += mountTable({
    id:'penTbl', rows: penRows(), exportName:'ifms_penal_interest_register.csv',
    exportTitle:'Bank remittance SLA and penal interest register', pageSize:15, rowKey:function(r){ return r.id; },
    empty:'No agency bank scroll line has breached the remittance SLA in the current dataset.',
    cols:[
      { k:'bank', label:'Bank', fmt:function(r){ return esc(bankName(r.bank)); } },
      { k:'branch', label:'Branch', fmt:function(r){ return dash(r.branch); } },
      { k:'source', label:'Source' },
      { k:'challan', label:'Challan / CIN', fmt:function(r){ return '<span class="mono">' + esc(r.challan) + '</span>' + (r.cin ? '<div class="tiny muted mono">' + esc(r.cin) + '</div>' : ''); } },
      { k:'payer', label:'Payer' },
      { k:'mode', label:'Mode' },
      { k:'recvDate', label:'Received', fmt:function(r){ return fmtDateDash(r.recvDate); }, cls:'nowrap' },
      { k:'realDate', label:'Realised', fmt:function(r){ return fmtDateDash(r.realDate); }, cls:'nowrap' },
      { k:'remitDate', label:'Remitted', fmt:function(r){ return fmtDateDash(r.remitDate); }, cls:'nowrap' },
      { k:'rbiDate', label:'RBI credit', fmt:function(r){ return fmtDateDash(r.rbiDate); }, cls:'nowrap' },
      { k:'amount', label:'Amount', cls:'num', sort:'num', foot:true, fmt:function(r){ return money(r.amount); } },
      { k:'slaDays', label:'SLA days', cls:'num', sort:'num' },
      { k:'actual', label:'Actual days', cls:'num', sort:'num' },
      { k:'delay', label:'Delay days', cls:'num', sort:'num', fmt:function(r){ return '<span class="badge b-amber">' + r.delay + '</span>'; } },
      { k:'penal', label:'Penal interest', cls:'num', sort:'num', foot:true, fmt:function(r){ return money(r.penal); } },
      { k:'recovered', label:'Recovered', cls:'num', sort:'num', foot:true, fmt:function(r){ return r.recovered ? money(r.recovered) : '<span class="muted">—</span>'; } },
      { k:'waived', label:'Waived', cls:'num', sort:'num', foot:true, fmt:function(r){ return r.waived ? money(r.waived) : '<span class="muted">—</span>'; } },
      { k:'letterStatus', label:'Recovery letter', fmt:function(r){ return badge(r.letterStatus) + (r.letterNo ? '<div class="tiny mono">' + esc(r.letterNo) + '</div>' : ''); } },
      { k:'act', label:'Actions', sort:false, noExport:true, fmt:function(r){
          var b = '<button class="btn btn-xs" data-act="penView|' + esc(r.id) + '">Calculation</button> ';
          if(can('penalty.letter')) b += '<button class="btn btn-xs btn-p" data-act="penLetter|' + esc(r.id) + '">Letter</button> ';
          if(can('penalty.response')) b += '<button class="btn btn-xs" data-act="penResponse|' + esc(r.id) + '">Response</button> ';
          if(can('penalty.waive') && penOutstanding(r) > 0) b += '<button class="btn btn-xs btn-warn" data-act="penWaive|' + esc(r.id) + '">Waive</button>';
          return b;
        } }
    ]
  });
  h += '</div>';

  /* bank-wise summary */
  var byBank = {};
  all.forEach(function(p){
    byBank[p.bank] = byBank[p.bank] || { n:0, amt:0, penal:0, rec:0, wv:0, maxDelay:0 };
    var o = byBank[p.bank];
    o.n++; o.amt = r2(o.amt + num(p.amount)); o.penal = r2(o.penal + num(p.penal));
    o.rec = r2(o.rec + num(p.recovered)); o.wv = r2(o.wv + num(p.waived));
    if(p.delay > o.maxDelay) o.maxDelay = p.delay;
  });
  h += '<div class="card"><div class="card-h"><div><h3>Bank-wise SLA performance</h3>' +
       '<div class="sub">All agency banks, including those with no breach in the current dataset</div></div></div><div class="tbl-wrap"><table class="dt"><thead><tr>' +
       '<th>Bank</th><th class="num">Scroll lines received</th><th class="num">Value received</th><th class="num">Late lines</th>' +
       '<th class="num">Late value</th><th class="num">Max delay (days)</th><th class="num">Penal interest</th>' +
       '<th class="num">Recovered</th><th class="num">Waived</th><th class="num">Outstanding</th><th>Compliance</th></tr></thead><tbody>';
  M().banks.filter(function(b){ return b.code !== 'RBI'; }).forEach(function(b){
    var lines = DB.bank.filter(function(x){ return nrm(x.bank_code) === nrm(b.code); });
    var o = byBank[b.code] || { n:0, amt:0, penal:0, rec:0, wv:0, maxDelay:0 };
    var lineVal = r2(lines.reduce(function(a, x){ return a + num(x.amount); }, 0));
    var comp = lines.length ? r2((lines.length - o.n) / lines.length * 100) : 100;
    h += '<tr><td><strong>' + esc(b.name) + '</strong><div class="tiny muted">' + esc(b.code) + ' &middot; ' + esc(b.focal) + '</div></td>' +

         '<td class="num">' + cnt(o.n) + '</td><td class="num">' + money(o.amt) + '</td><td class="num">' + o.maxDelay + '</td>' +
         '<td class="num">' + money(o.penal) + '</td><td class="num">' + money(o.rec) + '</td><td class="num">' + money(o.wv) + '</td>' +
         '<td class="num strong">' + money(r2(o.penal - o.rec - o.wv)) + '</td>' +
         '<td><span class="badge ' + (comp >= 99 ? 'b-green' : comp >= 90 ? 'b-amber' : 'b-red') + '">' + plain(comp, 1) + '%</span></td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

var REF_STAGES = {
  NON_JUDICIAL_STAMP: [
    { k:'Citizen application submitted',        role:'Citizen / Payer View' },
    { k:'Divisional Office document scrutiny',  role:'DDO / Department User' },
    { k:'SHCIL stamp validity verification',    role:'DDO / Department User' },

    { k:'PAO scrutiny and approval',            role:'PAO Checker' },
    { k:'E-payment instruction',                role:'PAO Maker' },
    { k:'Bank payment confirmation',            role:'PAO Maker' },
    { k:'Case closure / archival',              role:'PAO Maker' }
  ],
  JUDICIAL_STAMP: [
    { k:'Citizen / court-initiated request',    role:'Citizen / Payer View' },
    { k:'Court refund order captured',          role:'Finance Department User' },
    { k:'Finance Department forwards the order',role:'Finance Department User' },
    { k:'DDO refund-bill preparation',          role:'DDO / Department User' },
    { k:'PAO scrutiny and approval',            role:'PAO Checker' },
    { k:'E-payment instruction',                role:'PAO Maker' },
    { k:'Bank confirmation and closure',        role:'PAO Maker' }
  ]
};
var REFF = { type:'', status:'', pao:'', priority:'', pending:'' };

function refundById(no){ var o = null; DB.refunds.forEach(function(r){ if(r.caseNo === no) o = r; }); return o; }
function refundRows(){
  return DB.refunds.filter(function(r){
    if(REFF.type && r.type !== REFF.type) return false;
    if(REFF.status && r.status !== REFF.status) return false;
    if(REFF.pao && nrm(r.pao) !== nrm(REFF.pao)) return false;
    if(REFF.priority && r.priority !== REFF.priority) return false;
    if(REFF.pending && nrm(r.pendingAt).indexOf(nrm(REFF.pending)) < 0) return false;
    return true;
  });
}
function refundStages(r){ return REF_STAGES[r.type] || REF_STAGES.NON_JUDICIAL_STAMP; }
function refundOriginal(r){
  for(var i = 0; i < DB.recon.length; i++) if(nrm(DB.recon[i].challan) === nrm(r.origChallan)) return DB.recon[i];
  return null;
}
function refundAge(r){ var d = dayDiff(r.appDate, r.payDate || bizDate()); return d === null ? 0 : d; }
function refundStatusList(){
  return ['Submitted', 'Under Verification', 'Deficiency Raised', 'Court Order Received', 'Verified',
          'Bill Prepared', 'Pending PAO Approval', 'Approved', 'Payment Instructed', 'Paid', 'Rejected', 'Closed'];
}

function viewRefund(){
  if(ROLE === 'CITIZEN') return viewCitizenRefund();
  var all = DB.refunds;

  var paid = all.filter(function(r){ return r.status === 'Paid' || r.status === 'Closed'; });
  var appr = all.filter(function(r){ return ['Approved', 'Payment Instructed', 'Paid', 'Closed'].indexOf(r.status) >= 0; });
  var rej = all.filter(function(r){ return r.status === 'Rejected'; });
  var avgDays = paid.length ? r2(paid.reduce(function(a, r){ return a + refundAge(r); }, 0) / paid.length) : 0;

  var h = crumb(['Refund Management']);

  h += '<div class="fld"><label>Priority</label><select class="inp" data-chg="refF|priority">' + optVals(['High', 'Normal', 'Low'], REFF.priority, 'All priorities') + '</select></div>';
  h += '<div class="fld"><label>Pending at role contains</label><input class="inp" data-chg="refF|pending" value="' + esc(REFF.pending) + '"></div>';
  h += '</div>';

  h += mountTable({
    id:'refTbl', rows: refundRows(), exportName:'ifms_refund_register.csv', exportTitle:'Refund register',
    pageSize:12, rowKey:function(r){ return r.caseNo; },
    cols:[
      { k:'caseNo', label:'Case number', fmt:function(r){ return '<span class="mono strong">' + esc(r.caseNo) + '</span>'; } },
      { k:'type', label:'Refund type', fmt:function(r){ return r.type === 'JUDICIAL_STAMP' ? '<span class="badge b-violet">Judicial</span>' : '<span class="badge b-blue">Non-judicial</span>'; } },

      { k:'origChallan', label:'Original challan', fmt:function(r){

      { k:'origAmount', label:'Original amount', cls:'num', sort:'num', fmt:function(r){ return money(r.origAmount); } },
      { k:'claimAmount', label:'Claim amount', cls:'num', sort:'num', foot:true, fmt:function(r){ return money(r.claimAmount); } },
      { k:'validatedAmount', label:'Validated / refundable', cls:'num', sort:'num', foot:true,
        fmt:function(r){ return r.validatedAmount ? money(r.validatedAmount) : '<span class="muted">—</span>'; } },
      { k:'pao', label:'Dept / PAO / DDO', raw:function(r){ return r.dept + ' ' + r.pao; },
        fmt:function(r){ return esc(r.dept) + ' / ' + esc(r.pao) + '<div class="tiny muted">' + esc(r.ddo) + '</div>'; } },
      { k:'appDate', label:'Application date', fmt:function(r){ return fmtDateDash(r.appDate); }, cls:'nowrap' },
      { k:'status', label:'Status', fmt:function(r){ return badge(r.status); } },
      { k:'priority', label:'Priority', fmt:function(r){ return badge(r.priority); } },
      { k:'pendingAt', label:'Pending at', fmt:function(r){ return dash(r.pendingAt); } },
      { k:'payStatus', label:'Payment', fmt:function(r){ return badge(r.payStatus === 'Paid' ? 'Paid' : 'Pending') + (r.payRef ? '<div class="tiny mono">' + esc(r.payRef) + '</div>' : ''); } },
      { k:'age', label:'Ageing (days)', raw:function(r){ return refundAge(r); }, cls:'num', sort:'num' },
      { k:'act', label:'Actions', sort:false, noExport:true, fmt:function(r){
          return '<button class="btn btn-xs btn-p" data-act="refOpen|' + esc(r.caseNo) + '">Open case</button>'; } }
    ]
  });
  h += '</div>';

  /* workflow reference */
  h += '<div class="grid g2">';

         '<div class="steps">' + REF_STAGES[t].map(function(s, i){

         '<div class="small muted mt8"><strong>Document checklist:</strong> ' + esc(M().docChecklist[t].join(' &middot; ')) + '</div></div></div>';

    '<dt>Case number</dt><dd class="mono strong">' + esc(r.caseNo) + '</dd>' +
    '<dt>Applicant</dt><dd>' + esc(r.applicant) + '</dd>' +
    '<dt>Refund type</dt><dd>' + (r.type === 'JUDICIAL_STAMP' ? 'Judicial stamp (court order)' : 'Non-judicial stamp') + '</dd>' +
    '<dt>Application date</dt><dd>' + fmtDate(r.appDate) + '</dd>' +
    '<dt>Amount claimed</dt><dd class="strong">' + money(r.claimAmount) + '</dd>' +
    '<dt>Current status</dt><dd>' + badge(r.status) + '</dd>' +
    '<dt>Pending with</dt><dd>' + dash(r.pendingAt) + '</dd>' +
    '<dt>Payment status</dt><dd>' + badge(r.payStatus === 'Paid' ? 'Paid' : 'Pending') +
      (r.payRef ? ' &middot; reference <span class="mono">' + esc(r.payRef) + '</span> on ' + fmtDate(r.payDate) : '') + '</dd>' +
    (r.deficiency ? '<dt>Deficiency</dt><dd class="strong" style="color:var(--red-700)">' + esc(r.deficiency) + '</dd>' : '') +

};

/* ---------- refund case detail ---------- */
ACTIONS.refOpen = function(no){ openRefund(no); };
function openRefund(no){
  var r = refundById(no); if(!r) return;
  var stages = refundStages(r);
  var orig = refundOriginal(r);
  var chk = M().docChecklist[r.type] || [];

  var h = '<div class="steps">' + stages.map(function(s, i){
    return '<div class="step ' + (i < r.stage ? 'done' : i === r.stage ? 'cur' : '') + '"><span class="n">Stage ' + (i + 1) + '</span>' + esc(s.k) + '</div>';
  }).join('') + '</div>';
  h += '<div class="tabs" id="refTabs"><div class="tab active" data-tt="a">Case</div><div class="tab" data-tt="b">Verification</div>' +
       '<div class="tab" data-tt="c">Documents</div><div class="tab" data-tt="d">Bill &amp; payment</div><div class="tab" data-tt="e">History</div></div>';

  h += '<div data-tp="a"><dl class="kv">' +
    '<dt>Case number</dt><dd class="mono strong">' + esc(r.caseNo) + '</dd>' +
    '<dt>Refund type</dt><dd>' + (r.type === 'JUDICIAL_STAMP' ? 'Judicial stamp refund (court ordered)' : 'Non-judicial stamp refund') + '</dd>' +
    '<dt>Applicant</dt><dd>' + esc(r.applicant) + ' <span class="mono small">(' + esc(r.applicantId) + ')</span></dd>' +
    '<dt>Department / PAO / DDO</dt><dd>' + esc(deptName(r.dept)) + ' &middot; ' + esc(r.pao) + ' &middot; ' + esc(r.ddo) + '</dd>' +
    '<dt>Original challan</dt><dd class="mono">' + esc(r.origChallan) + '</dd>' +
    '<dt>Original receipt head</dt><dd class="mono">' + esc(r.origHead) + '</dd>' +
    '<dt>Original amount</dt><dd>' + money(r.origAmount) + '</dd>' +
    '<dt>Claim amount</dt><dd class="strong">' + money(r.claimAmount) + '</dd>' +
    '<dt>Validated / refundable</dt><dd>' + (r.validatedAmount ? money(r.validatedAmount) : '<span class="muted">Not yet validated</span>') + '</dd>' +
    '<dt>Application date</dt><dd>' + fmtDate(r.appDate) + ' <span class="small muted">(' + refundAge(r) + ' day(s) ago)</span></dd>' +
    '<dt>Status / priority</dt><dd>' + badge(r.status) + ' ' + badge(r.priority) + '</dd>' +
    '<dt>Pending at</dt><dd>' + dash(r.pendingAt) + '</dd>' +
    '<dt>Bank account / IFSC</dt><dd class="mono">' + esc(r.account) + ' &middot; ' + esc(r.ifsc) + '</dd>' +
    (r.stampCert ? '<dt>E-stamp certificate</dt><dd class="mono">' + esc(r.stampCert) + '</dd>' : '') +
    (r.courtOrder ? '<dt>Court order</dt><dd class="mono">' + esc(r.courtOrder) + '</dd>' : '') +
    (r.deficiency ? '<dt>Deficiency memo</dt><dd style="color:var(--red-700)">' + esc(r.deficiency) + '</dd>' : '') +
    (r.rejectReason ? '<dt>Rejection reason</dt><dd style="color:var(--red-700)">' + esc(r.rejectReason) + '</dd>' : '') +
    '</dl>';
  h += '<div class="box ' + (orig ? (orig.status === 'Matched' ? 'ok' : 'warn') : 'err') + ' mt12"><h4>Original receipt linkage</h4>' +
       (orig ? '<div class="small">Reconciliation ' + esc(orig.id) + ' — ' + esc(orig.status) + '. Portal ' + money(orig.portalAmt) +
               ', bank ' + money(orig.bankAmt) + ', RBI ' + money(orig.rbiAmt) + '. The refundable amount is capped at the reconciled receipt of <strong>' +
               money(orig.rbiAmt || orig.portalAmt) + '</strong>.</div>'
             : '<div class="small">Challan ' + esc(r.origChallan) + ' could not be located in the reconciled receipt data. ' +
               'The refund cannot be validated until the original receipt is confirmed, or a checker-approved override is recorded.</div>') + '</div></div>';

  h += '<div data-tp="b" class="hidden">';
  if(r.type === 'NON_JUDICIAL_STAMP'){
    h += '<div class="box mb12"><h4>SHCIL stamp validity verification</h4>' +
         '<dl class="kv" style="grid-template-columns:170px 1fr"><dt>Certificate</dt><dd class="mono">' + dash(r.stampCert) + '</dd>' +
         '<dt>Verification result</dt><dd>' + (r.shcil ? badge(r.shcil) : '<span class="badge b-grey">Not verified</span>') + '</dd></dl>' +
         (can('refund.process') ? '<div class="btn-group mt8"><button class="btn btn-sm btn-p" data-act="refShcil|' + esc(r.caseNo) + '">Run SHCIL verification</button></div>' : '') + '</div>';
  }else{
    h += '<div class="box mb12"><h4>Court refund order verification</h4>' +
         '<dl class="kv" style="grid-template-columns:170px 1fr"><dt>Court order</dt><dd class="mono">' + dash(r.courtOrder) + '</dd>' +
         '<dt>Verification result</dt><dd>' + (r.courtVerified ? badge(r.courtVerified) : '<span class="badge b-grey">Not verified</span>') + '</dd></dl>' +
         (can('refund.process') ? '<div class="btn-group mt8"><button class="btn btn-sm btn-p" data-act="refCourt|' + esc(r.caseNo) + '">Verify court order</button></div>' : '') + '</div>';
  }
  h += '<div class="box"><h4>Document checklist for this refund type</h4><ul class="small mb0">' +
       chk.map(function(c){
         var have = r.docs.some(function(d){ return nrm(d.type) === nrm(c); });
         return '<li>' + (have ? '<span style="color:var(--teal-700)">&#10003; </span>' : '<span style="color:var(--red-700)">&#10007; </span>') + esc(c) + '</li>';
       }).join('') + '</ul></div></div>';

  h += '<div data-tp="c" class="hidden">';
  h += r.docs.length ? '<table class="dt mb12"><thead><tr><th>File name</th><th>Document type</th><th class="num">Size</th><th>Uploaded at</th><th>By</th></tr></thead><tbody>' +
      r.docs.map(function(d){
        return '<tr><td>' + esc(d.name) + '</td><td>' + esc(d.type) + '</td><td class="num">' + cnt(d.size) + ' bytes</td><td>' + fmtStamp(d.at) + '</td><td>' + esc(d.by) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<div class="box mb12 small">No documents have been uploaded against this case.</div>';
  if(can('refund.process')) h += '<button class="btn btn-p btn-sm" data-act="refDoc|' + esc(r.caseNo) + '">Upload document</button>';
  h += '</div>';

  h += '<div data-tp="d" class="hidden">';
  h += '<dl class="kv mb12"><dt>Refund bill number</dt><dd class="mono">' + dash(r.billNo) + '</dd>' +
       '<dt>Bill date</dt><dd>' + fmtDateDash(r.billDate) + '</dd>' +
       '<dt>Approved by</dt><dd>' + dash(r.approvedBy) + (r.approvedOn ? ' on ' + fmtStamp(r.approvedOn) : '') + '</dd>' +
       '<dt>Payment status</dt><dd>' + badge(r.payStatus === 'Paid' ? 'Paid' : 'Pending') + '</dd>' +
       '<dt>Payment reference</dt><dd class="mono">' + dash(r.payRef) + '</dd>' +
       '<dt>Payment date</dt><dd>' + fmtDateDash(r.payDate) + '</dd>' +
       (r.overrideRemark ? '<dt>Override</dt><dd style="color:var(--amber-700)">' + esc(r.overrideRemark) + '</dd>' : '') + '</dl>';
  if(r.billNo){
    h += '<h4 class="mb8">Illustrative accounting entry for the refund</h4>' +
         '<table class="dt"><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>' +
         '<tr><td>Deduct-Refunds under ' + esc(r.origHead) + ' — ' + esc(headDesc(r.origHead)) + '</td><td class="num">' + money(r.validatedAmount || r.claimAmount) + '</td><td class="num">—</td></tr>' +
         '<tr><td>' + esc(M().config.clearingAccount) + ' (bank payment account)</td><td class="num">—</td><td class="num">' + money(r.validatedAmount || r.claimAmount) + '</td></tr>' +
         '</tbody></table>';
  }
  h += '</div>';

  h += '<div data-tp="e" class="hidden"><div class="timeline">' + r.history.map(function(x){
      return '<div class="tl-item"><div class="tt">' + esc(x.act) + '</div><div class="small">' + esc(x.note || '') + '</div>' +
             '<div class="td">' + fmtStamp(x.ts) + ' &middot; ' + esc(x.by) + '</div></div>';
    }).join('') + '</div></div>';

  var btns = [{ label:'Close' }];
  if(r.status !== 'Paid' && r.status !== 'Rejected' && r.status !== 'Closed'){
    if(can('refund.pay') && r.status === 'Approved')
      btns.unshift({ label:'Instruct e-payment', cls:'btn-ok', fn:function(){ ACTIONS.refPay(r.caseNo); } });
    if(can('refund.pay') && r.status === 'Payment Instructed')
      btns.unshift({ label:'Confirm bank payment', cls:'btn-ok', fn:function(){ ACTIONS.refConfirm(r.caseNo); } });
    if(can('refund.approve') && (r.status === 'Bill Prepared' || r.status === 'Pending PAO Approval')){
      btns.unshift({ label:'Reject', cls:'btn-dgr', fn:function(){ ACTIONS.refReject(r.caseNo); } });
      btns.unshift({ label:'Approve refund', cls:'btn-ok', fn:function(){ ACTIONS.refApprove(r.caseNo); } });
    }
    if(can('refund.process')){
      btns.unshift({ label:'Prepare refund bill', cls:'btn-p', fn:function(){ ACTIONS.refBill(r.caseNo); } });
      btns.unshift({ label:'Raise deficiency memo', fn:function(){ ACTIONS.refDeficiency(r.caseNo); } });
      btns.unshift({ label:'Advance stage', fn:function(){ ACTIONS.refAdvance(r.caseNo); } });
    }
  }
  var m = modal({ title:'Refund case ' + r.caseNo, sub: r.applicant + ' — ' + money(r.claimAmount) + ' — ' + r.status, width:'w1100', body: h, buttons: btns });
  wireTabs(m.el, 'refTabs');
  bindAll(m.el);
}
function refHist(r, act, note){ r.history.push({ ts: nowStamp(), by: curUser() + ' (' + roleName(ROLE) + ')', act: act, note: note || '' }); }

ACTIONS.refShcil = function(no){
  if(!guard('refund.process', 'run SHCIL verification')) return;
  var r = refundById(no);
  modal({ title:'SHCIL stamp validity verification', sub: r.stampCert || 'No certificate number recorded', width:'w520',
    body:'<div class="box info mb12 small">This prototype simulates the SHCIL e-stamp verification service. Select the result the demonstration should return.</div>' +
         '<div class="fld"><label>Verification result</label><select class="inp" id="sh_r">' + optVals(['Valid', 'Invalid', 'Not Found'], 'Valid') + '</select></div>' +
         '<div class="fld"><label>Remarks</label><input class="inp" id="sh_n" value="Certificate verified as unused and eligible for cancellation"></div>',
    buttons:[{ label:'Cancel' }, { label:'Record result', cls:'btn-p', fn:function(el){
      var res = tx(el.querySelector('#sh_r').value), note = tx(el.querySelector('#sh_n').value);
      r.shcil = res;
      refHist(r, 'SHCIL verification — ' + res, note);
      if(res === 'Valid'){
        r.status = 'Verified'; r.stage = Math.max(r.stage, 4); r.pendingAt = 'DDO / Department User';
        r.validatedAmount = Math.min(num(r.claimAmount), num(r.origAmount));
      }else{
        r.status = 'Deficiency Raised'; r.stage = 3; r.deficiency = 'SHCIL verification returned ' + res;
        DB.exceptions.push({ id:newExcId(), reconId:'', revId:'', category:'Refund validation failure', severity:'High',
          source:'STAMP', dept:r.dept, pao:r.pao, bank:'', challan:r.origChallan, cin:'', payer:r.applicant,
          amount:num(r.claimAmount), grossAmount:num(r.origAmount), raisedOn:bizDate(),
          due:addDays(bizDate(), num(M().config.escalationDays)), ageing:0, status:'Open', assigned:'', escalated:false,
          detail:'Refund case ' + r.caseNo + ': SHCIL verification returned ' + res + ' for certificate ' + r.stampCert,
          comments:[], resolution:'', closedOn:'' });
      }
      audit('Refund', 'SHCIL_VERIFY', 'Refund case', r.caseNo, '', res, note);
      save(); render(); toast('SHCIL verification recorded: ' + res + '.', res === 'Valid' ? 'ok' : 'warn');
    }}]});
};

         '<div class="fld"><label>Forwarding authority</label><input class="inp" id="ct_a" value="Finance Department"></div>' +
         '<div class="fld"><label>Remarks</label><input class="inp" id="ct_n" value="Certified copy of the court order received and found in order"></div>',
    buttons:[{ label:'Cancel' }, { label:'Record result', cls:'btn-p', fn:function(el){
      var res = tx(el.querySelector('#ct_r').value);

ACTIONS.refAdvance = function(no){
  if(!guard('refund.process', 'advance the refund workflow')) return;
  var r = refundById(no);
  var stages = refundStages(r);
  if(r.stage >= stages.length - 1){ toast('The case is already at the final stage.', 'warn'); return; }
  var next = stages[r.stage + 1];
  confirmDlg('Advance workflow stage',
    'Move case <strong>' + esc(r.caseNo) + '</strong> from "' + esc(stages[r.stage].k) + '" to "<strong>' + esc(next.k) + '</strong>"?',
    function(){
      r.stage = r.stage + 1;
      r.pendingAt = next.role;
      if(next.k.indexOf('scrutiny') >= 0 && next.k.indexOf('PAO') < 0) r.status = 'Under Verification';
      audit('Refund', 'REFUND_STAGE_ADVANCE', 'Refund case', r.caseNo, stages[r.stage - 1].k, next.k, 'Workflow stage advanced');
      refHist(r, 'Stage advanced to ' + next.k, '');
      save(); render(); toast('Case moved to "' + next.k + '".', 'ok');
    }, 'Advance');
};
ACTIONS.refDeficiency = function(no){
  if(!guard('refund.process', 'raise a deficiency memo')) return;
  var r = refundById(no);
  promptDlg('Raise deficiency memo — ' + no, 'Deficiency to be communicated to the applicant', function(v){
    r.deficiency = v; r.status = 'Deficiency Raised'; r.pendingAt = 'Citizen / Payer View';
    refHist(r, 'Deficiency memo issued', v);
    audit('Refund', 'REFUND_DEFICIENCY', 'Refund case', r.caseNo, '', v, 'Deficiency memo issued to the applicant');
    notify('Deficiency memo issued', r.caseNo + ' returned to the applicant.', 'warn');
    save(); render(); toast('Deficiency memo recorded.', 'warn');
  }, 'Original e-stamp certificate not enclosed with the application.', true);
};
ACTIONS.refBill = function(no){
  if(!guard('refund.process', 'prepare a refund bill')) return;
  var r = refundById(no);
  var orig = refundOriginal(r);
  var cap = orig ? r2(orig.rbiAmt || orig.portalAmt) : num(r.origAmount);
  modal({ title:'Prepare refund bill — ' + r.caseNo, width:'w520',
    body:'<div class="box info mb12 small">Reconciled original receipt: <strong>' + money(cap) + '</strong>' +
         (orig ? ' (reconciliation ' + esc(orig.id) + ', status ' + esc(orig.status) + ')' : ' — the original receipt is not reconciled') +
         '. The refundable amount cannot exceed this figure unless a justified override is approved by the checker.</div>' +
         '<div class="fld"><label>Refundable amount (INR)</label><input type="number" step="0.01" class="inp" id="rb_a" value="' + esc(Math.min(num(r.claimAmount), cap)) + '"></div>' +
         '<div class="fld"><label>Bill remarks</label><input class="inp" id="rb_n" value="Refund bill prepared against the original receipt"></div>' +
         '<div class="fld"><label class="chkline"><input type="checkbox" id="rb_ov"> Request an override to exceed the reconciled receipt amount</label>' +
         '<textarea class="inp mt4" id="rb_or" rows="2" placeholder="Justification for the override (required if the box above is ticked)"></textarea></div>',
    buttons:[{ label:'Cancel' }, { label:'Prepare bill', cls:'btn-p', keepOpen:true, fn:function(el, close){
      var amt = r2(num(el.querySelector('#rb_a').value));
      var ov = el.querySelector('#rb_ov').checked, ovr = tx(el.querySelector('#rb_or').value);
      if(amt <= 0){ toast('The refundable amount must be greater than zero.', 'err'); return; }
      if(amt > cap && !ov){ toast('The refundable amount exceeds the reconciled receipt of ' + money(cap) + '. Tick the override box and record a justification.', 'err'); return; }
      if(amt > cap && !ovr){ toast('An override justification is mandatory.', 'err'); return; }
      r.validatedAmount = amt;
      r.billNo = 'RFB-2026-' + pad(nextSeq('rfb'), 5);
      r.billDate = bizDate();
      r.status = 'Pending PAO Approval';
      r.pendingAt = 'PAO Checker';
      r.stage = Math.max(r.stage, refundStages(r).length - 4);
      if(amt > cap){ r.overrideRemark = 'Override requested: ' + ovr + ' (awaiting checker approval)'; }
      refHist(r, 'Refund bill ' + r.billNo + ' prepared', money(amt) + '. ' + tx(el.querySelector('#rb_n').value));
      audit('Refund', 'REFUND_BILL_PREPARE', 'Refund case', r.caseNo, money(r.claimAmount), money(amt),
            'Bill ' + r.billNo + (amt > cap ? ' with override request: ' + ovr : ''));
      notify('Refund bill awaiting approval', r.caseNo + ' — ' + money(amt) + ' pending PAO Checker approval.', 'info');
      save(); close(); render(); toast('Refund bill ' + r.billNo + ' prepared and routed to the PAO Checker.', 'ok');
    }}]});
};
ACTIONS.refApprove = function(no){
  if(!guard('refund.approve', 'approve refunds')) return;
  var r = refundById(no);
  promptDlg('Approve refund ' + no, 'Approval remarks (PAO scrutiny)', function(v){
    r.status = 'Approved'; r.approvedBy = curUser(); r.approvedOn = nowStamp();
    r.pendingAt = 'PAO Maker'; r.stage = Math.max(r.stage, refundStages(r).length - 3);
    if(r.overrideRemark) r.overrideRemark = r.overrideRemark.replace('awaiting checker approval', 'approved by ' + curUser());
    refHist(r, 'Refund approved by PAO Checker', v);
    audit('Refund', 'REFUND_APPROVE', 'Refund case', r.caseNo, 'Pending PAO Approval', 'Approved', v);
    notify('Refund approved', r.caseNo + ' approved for ' + money(r.validatedAmount) + '.', 'ok');
    save(); render(); toast('Refund approved.', 'ok');
  }, 'Documents and original receipt linkage verified; refund approved.');
};
ACTIONS.refReject = function(no){
  if(!guard('refund.approve', 'reject refunds')) return;
  var r = refundById(no);
  promptDlg('Reject refund ' + no, 'Reason for rejection', function(v){
    r.status = 'Rejected'; r.rejectReason = v; r.pendingAt = '';
    refHist(r, 'Refund rejected by PAO Checker', v);
    audit('Refund', 'REFUND_REJECT', 'Refund case', r.caseNo, 'Pending PAO Approval', 'Rejected', v);

var DEVF = { body:'', source:'', status:'', pay:'' };

function claimById(no){ var o = null; DB.devolution.forEach(function(c){ if(c.claimNo === no) o = c; }); return o; }
function devRuleFor(c){
  var found = null;
  M().devolutionRules.forEach(function(r){
    if(r.active === false) return;
    if(nrm(r.body) === nrm(c.body) && nrm(r.source) === nrm(c.source)) found = r;
  });
  return found;
}
/* Eligible collections = reconciled (Matched) receipts of the source / head within the claim period. */
function eligibleCollections(c){
  return DB.recon.filter(function(r){
    if(r.status !== 'Matched') return false;
    if(nrm(r.source) !== nrm(c.source)) return false;
    if(c.head && nrm(r.head) !== nrm(c.head)) return false;
    if(!validDate(r.portalDate)) return false;
    if(c.from && r.portalDate < c.from) return false;
    if(c.to && r.portalDate > c.to) return false;
    return true;
  });
}
function computeDevolution(){
  DB.devolution.forEach(function(c){
    var rule = devRuleFor(c);
    var recs = eligibleCollections(c);
    c.eligible = r2(recs.reduce(function(a, r){ return a + (r.rbiAmt || r.portalAmt); }, 0));
    c.rulePct = rule ? num(rule.value) : 0;
    c.computed = rule ? (rule.basis === 'PERCENT' ? r2(c.eligible * num(rule.value) / 100) : num(rule.value)) : 0;
    c.variance = r2(num(c.claimAmount) - num(c.computed));
    c.eligibleCount = recs.length;
  });
  save();
}
function devRows(){
  return DB.devolution.filter(function(c){
    if(DEVF.body && nrm(c.body) !== nrm(DEVF.body)) return false;
    if(DEVF.source && nrm(c.source) !== nrm(DEVF.source)) return false;
    if(DEVF.status && c.status !== DEVF.status) return false;
    if(DEVF.pay && c.payStatus !== DEVF.pay) return false;
    return true;
  });
}

function provisionalEntry(r){
  var amt = r.rbiAmt || r.bankAmt || r.portalAmt;
  var dr, cr, note;
  if(r.status === 'Matched'){
    dr = M().config.clearingAccount;
    cr = r.head + ' — ' + headDesc(r.head);
    note = 'Final receipt booking entry on completion of three-way reconciliation.';
  }else if(r.status === 'RAT'){
    dr = M().config.clearingAccount;
    cr = M().config.ratHead;
    note = 'Credit received without a departmental portal record. Parked in the RAT suspense head until the receipt is identified and transferred.';
  }else{
    dr = M().config.clearingAccount;
    cr = M().config.suspenseHead;
    note = 'Provisional / draft entry only. The receipt must not be booked to the normal revenue receipt head while the status is ' + r.status + '.';

  return '<table class="dt"><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>' +
    '<tr><td>' + esc(dr) + '</td><td class="num">' + money(amt) + '</td><td class="num">—</td></tr>' +

ACTIONS.accBulkVch = function(){
  if(!guard('voucher.create', 'create receipt vouchers')) return;
  var ready = DB.recon.filter(function(r){ return r.status === 'Matched' && !r.voucher; });
  if(!ready.length){ toast('No matched receipt is awaiting a voucher.', 'warn'); return; }
  confirmDlg('Create receipt vouchers',
    'Draft receipt vouchers will be created for <strong>' + ready.length + '</strong> fully reconciled receipt(s) totalling <strong>' +
    money(ready.reduce(function(a, r){ return a + r.rbiAmt; }, 0)) + '</strong>. Each voucher requires PAO Checker approval before it is treated as booked.',
    function(){
      ready.forEach(function(r){
        var no = newVchId();
        DB.vouchers.unshift({
          no: no, kind:'RECEIPT', date: bizDate(), period: M().config.fy, pao: r.pao, dept: r.dept,
          reconId: r.id, refCase:'', debit: M().config.clearingAccount,
          credit: r.head + ' — ' + headDesc(r.head), amount: r.rbiAmt,
          status:'Draft', maker: curUser(), makerAt: nowStamp(), checker:'', checkerAt:'',
          narration:'Revenue receipt booked on three-way reconciliation of challan ' + r.challan + ' — ' + r.payer + '.'
        });
        r.voucher = no;
      });
      audit('Accounting', 'VOUCHER_CREATE_BULK', 'Receipt voucher', '', '', ready.length + ' vouchers',
            'Draft receipt vouchers created for ' + ready.length + ' reconciled receipt(s)');
      save(); render(); toast(ready.length + ' draft voucher(s) created.', 'ok');
    }, 'Create vouchers');
};

ACTIONS.accVchApprove = function(no){
  if(!guard('voucher.approve', 'approve receipt vouchers')) return;
  var v = vchById(no); if(!v) return;
  promptDlg('Approve voucher ' + no, 'Checker remarks', function(rm){
    v.status = 'Approved'; v.checker = curUser(); v.checkerAt = nowStamp();
    v.narration += ' Approved: ' + rm;
    var r = reconById(v.reconId);
    if(r){ r.booking = 'Booked'; }
    var p = null;
    DB.portal.forEach(function(x){ if(r && r.portalIds.indexOf(x.__id) >= 0) p = x; });
    if(p) p.bookingStatus = 'Booked';
    audit('Accounting', 'VOUCHER_APPROVE', 'Receipt voucher', no, 'Draft', 'Approved', rm + ' — ' + money(v.amount) + ' booked');
    save(); render(); toast('Voucher ' + no + ' approved — receipt booked.', 'ok');
  }, 'Reconciliation evidence verified; booking approved.');
};
ACTIONS.accVchReject = function(no){
  if(!guard('voucher.approve', 'reject receipt vouchers')) return;
  var v = vchById(no); if(!v) return;
  promptDlg('Reject voucher ' + no, 'Reason for rejection', function(rm){
    v.status = 'Rejected'; v.checker = curUser(); v.checkerAt = nowStamp();
    var r = reconById(v.reconId);
    if(r){ r.voucher = ''; r.booking = 'Ready for Booking'; }

var RPF = { from:'', to:'', source:'', dept:'', pao:'', bank:'' };
var RP_ACTIVE = 'r01';

function rpMatch(o){
  if(RPF.source && nrm(o.source) !== nrm(RPF.source)) return false;
  if(RPF.dept && nrm(o.dept) !== nrm(RPF.dept)) return false;
  if(RPF.pao && nrm(o.pao) !== nrm(RPF.pao)) return false;
  if(RPF.bank && o.bank && nrm(o.bank) !== nrm(RPF.bank)) return false;
  if(RPF.from && o.date && o.date < RPF.from) return false;
  if(RPF.to && o.date && o.date > RPF.to) return false;
  return true;
}
function rpRecon(){
  return DB.recon.filter(function(r){ return rpMatch({ source:r.source, dept:r.dept, pao:r.pao, bank:r.bank, date:r.portalDate || r.rbiDate }); });
}
function rpPortal(){
  return DB.portal.filter(function(p){ return rpMatch({ source:p.revenue_source, dept:p.department_code, pao:p.pao_code, date:p.payment_date }); });
}
function rpBank(){
  return DB.bank.filter(function(b){ return rpMatch({ source:b.revenue_source, dept:b.department_code, pao:b.pao_code, bank:b.bank_code, date:b.scroll_date }); });
}
function rpPen(){
  return DB.penalties.filter(function(p){ return rpMatch({ source:p.source, dept:p.dept, pao:p.pao, bank:p.bank, date:p.remitDate }); });
}
function grp(list, keyFn){
  var o = {}, order = [];
  list.forEach(function(x){
    var k = keyFn(x);
    if(!o[k]){ o[k] = []; order.push(k); }
    o[k].push(x);
  });
  return { map:o, keys:order };
}
function sum(list, f){ return r2(list.reduce(function(a, x){ return a + num(f(x)); }, 0)); }

function reportById(id){ var o = null; REPORTS.forEach(function(r){ if(r.id === id) o = r; }); return o; }

function viewReports(){
  var rep = reportById(RP_ACTIVE) || REPORTS[0];
  var out;
  try{ out = rep.build(); }
  catch(e){ out = { headers:['Error'], rows:[[e.message]], money:[] }; }
  var total = 0;
  (out.money || []).forEach(function(ci){ out.rows.forEach(function(r){ if(String(r[0]) !== 'TOTAL') total = r2(total + num(r[ci])); }); });
  var monetary = out.money && out.money.length ? r2(out.rows.filter(function(r){ return String(r[0]) !== 'TOTAL'; })
      .reduce(function(a, r){ return a + num(r[out.money[0]]); }, 0)) : 0;

  var h = crumb(['Reports & MIS']);
  h += pageHead('Reports & MIS',
    'Seventeen operational and governance reports, each with date, source, department, PAO and bank parameters, generation metadata and CSV export.',
    '<button class="btn btn-sm" data-act="rpPrint">&#128424; Print report</button>' +
    (can('export') ? '<button class="btn btn-p btn-sm" data-act="rpExport">&#11015; Export current report</button>' : ''));

  h += '<div class="card"><div class="card-h"><div><h3>Report parameters</h3>' +
       '<div class="sub">Parameters apply to every report in the catalogue</div></div>' +
       '<button class="btn btn-sm" data-act="rpClear">Clear parameters</button></div>';

  h += '<div class="fld"><label>Department</label><select class="inp" data-chg="rpF|dept">' + optList(M().departments, 'code', 'name', RPF.dept, 'All departments') + '</select></div>';

  h += '<div class="fld"><label>Bank</label><select class="inp" data-chg="rpF|bank">' + optList(M().banks, 'code', 'name', RPF.bank, 'All banks') + '</select></div>';
  h += '</div></div>';

  h += '<div class="grid" style="grid-template-columns:300px minmax(0,1fr)">';
  h += '<div class="card"><div class="card-h"><h3>Report catalogue</h3></div><div class="card-b tight">';
  var lastG = '';
  REPORTS.forEach(function(r){
    if(r.group !== lastG){ h += '<div class="nav-sec" style="color:var(--grey-600);background:var(--grey-050)">' + esc(r.group) + '</div>'; lastG = r.group; }
    h += '<div style="padding:7px 12px;border-bottom:1px solid var(--grey-200);cursor:pointer;' +
         (r.id === RP_ACTIVE ? 'background:var(--navy-050);border-left:3px solid var(--teal-600);font-weight:600' : 'border-left:3px solid transparent') +
         '" data-act="rpPick|' + r.id + '"><div style="font-size:12px">' + esc(r.name) + '</div>' +
         '<div class="tiny muted">' + esc(r.desc) + '</div></div>';
  });
  h += '</div></div>';

  h += '<div><div class="card"><div class="card-h"><div><h3>' + esc(rep.name) + '</h3><div class="sub">' + esc(rep.desc) + '</div></div></div>' +
       '<div class="card-b"><dl class="kv" style="grid-template-columns:150px 1fr">' +
       '<dt>Report parameters</dt><dd class="small">' +
       esc(['Date ' + (RPF.from ? fmtDate(RPF.from) : 'all') + ' to ' + (RPF.to ? fmtDate(RPF.to) : 'all'),
            'Source: ' + (RPF.source || 'All'), 'Department: ' + (RPF.dept || 'All'),
            'PAO: ' + (RPF.pao || 'All'), 'Bank: ' + (RPF.bank || 'All')].join(' &middot; ')).replace(/&amp;middot;/g, '&middot;') + '</dd>' +
       '<dt>Generated on</dt><dd>' + fmtDate(nowStamp().slice(0, 10)) + ' ' + esc(nowStamp().slice(11)) + '</dd>' +
       '<dt>Generated by</dt><dd>' + esc(curUser()) + ' (' + esc(roleName(ROLE)) + ')</dd>' +
       '<dt>Demo business date</dt><dd>' + fmtDate(bizDate()) + ' &middot; financial year ' + esc(M().config.fy) + '</dd>' +
       '<dt>Record count</dt><dd class="strong">' + cnt(out.rows.length) + '</dd>' +
       '<dt>Monetary total</dt><dd class="strong">' + (out.money && out.money.length ? money(monetary) : '<span class="muted">Not applicable</span>') + '</dd>' +
       '</dl></div>';
  h += '<div class="tbl-wrap"><table class="dt" id="rpTable"><thead><tr>' +
       out.headers.map(function(x, i){ return '<th class="' + ((out.money || []).indexOf(i) >= 0 ? 'num' : '') + '">' + esc(x) + '</th>'; }).join('') +
       '</tr></thead><tbody>';
  if(!out.rows.length){
    h += '<tr><td colspan="' + out.headers.length + '"><div class="empty">No data matches the selected report parameters.</div></td></tr>';
  }else{
    out.rows.slice(0, 400).forEach(function(row){
      var isTotal = String(row[0]) === 'TOTAL';
      h += '<tr' + (isTotal ? ' style="font-weight:700;background:var(--grey-050)"' : '') + '>' +
        row.map(function(c, i){
          var isM = (out.money || []).indexOf(i) >= 0;
          return '<td class="' + (isM ? 'num' : '') + '">' + (isM ? money(c) : (c === '' || c === null || c === undefined ? '<span class="muted">—</span>' : esc(String(c)))) + '</td>';
        }).join('') + '</tr>';
    });
  }
  h += '</tbody></table></div>';
  if(out.rows.length > 400) h += '<div class="tbl-foot">Showing the first 400 of ' + cnt(out.rows.length) + ' rows on screen. Export to CSV for the complete report.</div>';
  h += '</div></div></div>';
  return h;
}

function editMaster(key, idx){
  if(!guard('masters.edit', 'maintain master data')) return;
  var def = MASTER_DEFS[key], list = M()[key];
  var row = idx >= 0 ? list[idx] : {};
  var b = '<div class="grid g2">';
  def.fields.forEach(function(f){
    var v = row[f[0]] === undefined ? '' : row[f[0]];
    b += '<div class="fld"><label>' + esc(f[1]) + '</label>';
    if(f[2] === 'dept') b += '<select class="inp" id="mf_' + f[0] + '">' + optList(M().departments, 'code', 'name', v, '—') + '</select>';
    else if(f[2] === 'pao') b += '<select class="inp" id="mf_' + f[0] + '">' + optList(M().paos, 'code', 'name', v, '—') + '</select>';
    else if(f[2] === 'bank') b += '<select class="inp" id="mf_' + f[0] + '">' + optList(M().banks, 'code', 'name', v, '—') + '</select>';
    else if(f[2] === 'source') b += '<select class="inp" id="mf_' + f[0] + '">' + optList(M().sources, 'code', 'name', v, '—') + '</select>';
    else if(f[2] === 'portal') b += '<select class="inp" id="mf_' + f[0] + '">' + optList(M().portals, 'code', 'name', v, '—') + '</select>';
    else if(f[2] === 'head') b += '<select class="inp" id="mf_' + f[0] + '">' + optList(M().heads, 'code', 'code', v, '—') + '</select>';
    else if(f[2] === 'treasury') b += '<select class="inp" id="mf_' + f[0] + '">' + optList(M().treasuries, 'code', 'name', v, '—') + '</select>';
    else b += '<input class="inp" type="' + (f[2] === 'number' ? 'number' : 'text') + '" ' + (f[2] === 'number' ? 'step="0.01" ' : '') +
              'id="mf_' + f[0] + '" value="' + esc(v) + '"' + (idx >= 0 && (f[0] === 'code' || f[0] === 'id') ? ' readonly' : '') + '>';
    b += '</div>';
  });
  b += '</div><div id="mf_err"></div>';
  modal({ title:(idx >= 0 ? 'Edit ' : 'Add ') + (def.one || def.label), width:'w900', body: b,
    buttons:[{ label:'Cancel' }, { label:'Save', cls:'btn-p', keepOpen:true, fn:function(el, close){
      var o = idx >= 0 ? list[idx] : { active:true };
      var old = idx >= 0 ? JSON.stringify(o) : '';
      var missing = [];
      def.fields.forEach(function(f){
        var v = tx(el.querySelector('#mf_' + f[0]).value);
        if((f[0] === 'code' || f[0] === 'id' || f[0] === 'name' || f[0] === 'desc') && !v && idx < 0) missing.push(f[1]);
        o[f[0]] = f[2] === 'number' ? num(v) : v;
      });
      if(missing.length){ el.querySelector('#mf_err').innerHTML = '<div class="errbar mt8">Required: ' + esc(missing.join(', ')) + '</div>'; return; }
      if(idx < 0){
        var dup = list.some(function(x){ return up(x.code || x.id) === up(o.code || o.id); });
        if(dup){ el.querySelector('#mf_err').innerHTML = '<div class="errbar mt8">A record with this code already exists.</div>'; return; }
        list.push(o);
      }
      audit('Masters', idx >= 0 ? 'MASTER_EDIT' : 'MASTER_ADD', def.label, o.code || o.id, old, JSON.stringify(o), 'Master record maintained');
      save(); close(); render(); toast((def.one || def.label) + ' saved.', 'ok');
    }}]});
}

var AUDF = { module:'', action:'', user:'', from:'', to:'' };
function auditRows(){
  return DB.audit.filter(function(a){
    if(AUDF.module && a.module !== AUDF.module) return false;
    if(AUDF.action && a.action.indexOf(AUDF.action) < 0) return false;
    if(AUDF.user && nrm(a.user).indexOf(nrm(AUDF.user)) < 0) return false;
    if(AUDF.from && a.ts.slice(0, 10) < AUDF.from) return false;

var GLOSSARY = [
  ['CPIN', 'Common Portal Identification Number — the reference generated by a revenue portal (notably GSTN) when a challan is created, before payment is made.'],
  ['CIN', 'Challan Identification Number — generated by the collecting bank once payment succeeds. It ties the portal challan to the bank credit and is the strongest three-way reconciliation key.'],
  ['Challan', 'The instrument through which a payer deposits government revenue, carrying the receipt head, payer particulars and amount.'],
  ['Bank scroll', 'The daily statement sent by an agency bank listing every government receipt collected by its branches, with the remittance particulars.'],
  ['UTR', 'Unique Transaction Reference — the reference of the inter-bank fund transfer that carries the collection to the government account.'],
  ['RBI luggage file', 'The file sent by the RBI Central Accounts Section confirming credits to the government revenue account, used as the final leg of reconciliation.'],
  ['Suspend', 'A portal receipt that has not been confirmed by an RBI government-account credit after the permitted SLA. The portal amount exceeds the RBI amount and the receipt is held in suspense.'],
  ['RAT', 'Receipt Awaiting Transfer — a bank or RBI credit with no corresponding departmental portal record. The RBI amount exceeds the portal amount and the credit is parked in the RAT suspense head until identified.'],
  ['Receipt booking', 'The accounting entry that credits the applicable revenue receipt head on completion of three-way reconciliation, made by a PAO Maker and approved by a PAO Checker.'],
  ['Penal interest', 'Interest chargeable to an agency bank when government revenue is not remitted within the permitted period, computed on a simple daily basis.'],
  ['Refund', 'Return of stamp duty or other revenue to a payer, either on cancellation of a non-judicial stamp or under a court order in the case of judicial stamps.'],
  ['Devolution', 'The share of revenue collected by the state on behalf of municipal corporations and district local bodies, computed from reconciled collections and settled by a devolution advice.']
];

  { challan:'CH-ST-40002',  status:'Matched',   note:'Matched — exact stamp match' },
  { challan:'CH-NT-60002',  status:'Matched',   note:'Matched — exact non-tax match' },
  { challan:'CH-GST-10005', status:'Suspend',   note:'Suspend — portal record exists but the bank / RBI credit is missing after the SLA' },
  { challan:'CH-TR-30003',  status:'Matched',   note:'Matched One-to-Many settlement: 12,000 + 8,000 = 20,000', matchType:'One-to-Many' },
  { challan:'CH-GST-10006', status:'Duplicate', note:'Duplicate / Mismatch — two bank records totalling 30,000 against portal / RBI 15,000' },
  { challan:'CH-GST-99999', status:'RAT',       note:'RAT — bank / RBI receipt without a corresponding portal record' }
];

function runTestSuite(){
  if(!guard('testsuite.run', 'run the demo test suite')) return;
  confirmDlg('Run Demo Test Suite',
    'The test suite <strong>resets the application to the included demo datasets</strong>, re-runs every validation and the reconciliation engine, and then verifies each expected outcome.' +
    '<p class="small mt8 mb0">Any data you have entered in this browser will be discarded. Two sample CSV files will be downloaded as part of the export verification step.</p>',
    function(){ executeTests(); }, 'Reset and run tests');
}
function executeTests(){
  var res = [], t0 = Date.now();
  function T(name, expected, actual, pass, detail){
    res.push({ name:name, expected:expected, actual:actual, pass:!!pass, detail:detail || '' });
  }
  /* 1. reset */
  try{
    resetDemo();
    T('Reset to default demo datasets', '3 approved batches with 53 source records',
      DB.batches.filter(function(b){ return b.status === 'Approved'; }).length + ' approved batches with ' +
      (DB.portal.length + DB.bank.length + DB.rbi.length) + ' source records',
      DB.batches.filter(function(b){ return b.status === 'Approved'; }).length === 3 &&
      (DB.portal.length + DB.bank.length + DB.rbi.length) === 53);
  }catch(e){ T('Reset to default demo datasets', 'No error', 'Error: ' + e.message, false); }

  /* 2. validations
     The three core files have already been posted and approved by the reset, so re-validating them
     must show every row as structurally valid AND detected as a duplicate of posted data. That
     simultaneously proves field validation and the duplicate-detection control. */
  try{
    [['portal', 16, 'Portal file'], ['bank', 19, 'Agency bank scroll'], ['rbi', 18, 'RBI luggage file']].forEach(function(spec){
      var v = validateUpload(spec[0], csvToObjects(SAMPLE_CSV[spec[0]].text), {});
      T(spec[2] + ' — field validation', spec[1] + ' rows structurally valid, 0 field errors',
        (v.valid.length + v.dupInFile.length) + ' structurally valid, ' + v.invalid.length + ' field error(s)',
        (v.valid.length + v.dupInFile.length) === spec[1] && v.invalid.length === 0);
      T(spec[2] + ' — duplicate detection against posted data', spec[1] + ' duplicates detected, 0 silently posted',
        v.dupInFile.length + ' duplicate(s) held, ' + v.valid.length + ' would post',
        v.dupInFile.length === spec[1] && v.valid.length === 0,
        v.dupInFile.length ? v.dupInFile[0].dup : '');
    });
    var vi = validateUpload('portal', csvToObjects(SAMPLE_CSV.invalid.text), {});
    T('Invalid portal file rejected with reasons', '0 valid / 4 invalid', vi.valid.length + ' valid / ' + vi.invalid.length + ' invalid',
      vi.valid.length === 0 && vi.invalid.length === 4,
      vi.invalid.map(function(x){ return 'Row ' + x.line + ': ' + x.errors[0]; }).join(' | '));
  }catch(e){ T('Upload validation', 'No error', 'Error: ' + e.message, false); }

  /* 3. reconciliation */
  var out = null;
  try{
    out = runRecon(null);
    commitRecon(out, 'Demo test suite run');
    T('Reconciliation run and commit', '17 reconciliation rows', out.results.length + ' reconciliation rows', out.results.length === 17);
  }catch(e){ T('Reconciliation run and commit', 'No error', 'Error: ' + e.message, false); }

  /* 4. expected outcomes per test case */
  var byCh = {};
  DB.recon.forEach(function(r){ byCh[nrm(r.challan)] = r; });
  TEST_CASES.forEach(function(tc){
    var r = byCh[nrm(tc.challan)];
    var actual = r ? r.status : 'not reconciled';
    var pass = !!r && r.status === tc.status && (!tc.matchType || r.matchType === tc.matchType) && (!tc.late || r.slaDelay > 0);
    T('Case ' + tc.challan, tc.status + (tc.matchType ? ' (' + tc.matchType + ')' : '') + (tc.late ? ' + late remittance' : ''),
      actual + (r && r.matchType ? ' (' + r.matchType + ')' : '') + (r && r.slaDelay > 0 ? ' + ' + r.slaDelay + ' day(s) late' : ''),
      pass, r ? r.reason : '');
  });

  /* 5. category assertions */
  var oneToMany = DB.recon.filter(function(r){ return r.matchType === 'One-to-Many' && r.status === 'Matched'; });
  T('At least one Matched One-to-Many case', '>= 1', oneToMany.length + ' (' + oneToMany.map(function(r){ return r.challan; }).join(', ') + ')', oneToMany.length >= 1);
  var susp = DB.recon.filter(function(r){ return r.status === 'Suspend'; });
  T('At least one Suspend case', '>= 1', susp.length + ' (' + susp.map(function(r){ return r.challan; }).join(', ') + ')', susp.length >= 1);
  var rat = DB.recon.filter(function(r){ return r.status === 'RAT'; });
  T('At least one RAT case', '>= 1', rat.length + ' (' + rat.map(function(r){ return r.challan; }).join(', ') + ')', rat.length >= 1);
  var mis = DB.recon.filter(function(r){ return r.status === 'Mismatch'; });
  T('At least one amount mismatch', '>= 1', mis.length + ' (' + mis.map(function(r){ return r.challan + ' diff ' + money(r.diff); }).join(', ') + ')', mis.length >= 1);
  var dup = DB.recon.filter(function(r){ return r.status === 'Duplicate'; });
  T('At least one duplicate case', '>= 1', dup.length + ' (' + dup.map(function(r){ return r.challan; }).join(', ') + ')', dup.length >= 1);
  var pen = DB.penalties.filter(function(p){ return p.delay > 0 && p.penal > 0; });
  T('Penal interest calculated for delayed remittances', '>= 1 case with penal interest > 0',
    pen.length + ' case(s), total ' + money(pen.reduce(function(a, p){ return a + p.penal; }, 0)), pen.length >= 1,
    pen.map(function(p){ return p.challan + ': ' + p.delay + ' day(s) = ' + money(p.penal); }).join(' | '));
  T('Matched status always requires RBI confirmation', 'No Matched row with zero RBI amount',
    DB.recon.filter(function(r){ return r.status === 'Matched' && r.rbiAmt <= 0; }).length + ' violation(s)',
    DB.recon.filter(function(r){ return r.status === 'Matched' && r.rbiAmt <= 0; }).length === 0);
  T('Exceptions raised for every non-clean outcome', '>= 5 exceptions',
    DB.exceptions.length + ' exception(s) across ' +
    Object.keys(DB.exceptions.reduce(function(a, e){ a[e.category] = 1; return a; }, {})).length + ' categories',
    DB.exceptions.length >= 5);
  var ctlPortal = r2(DB.portal.reduce(function(a, p){ return a + num(p.amount); }, 0));
  var ctlRecon = r2(DB.recon.reduce(function(a, r){ return a + r.portalAmt; }, 0));
  T('Control total preserved through reconciliation', money(ctlPortal), money(ctlRecon), Math.abs(ctlPortal - ctlRecon) < 0.01);

  /* 6. export and download verification through visible user actions */
  try{
    var before = document.querySelectorAll('a[download]').length;
    downloadText('ifms_test_export_verification.csv',
      'Reconciliation ID,Challan,Status,Portal,Bank,RBI,Difference\n' +
      DB.recon.map(function(r){ return [r.id, r.challan, r.status, r.portalAmt, r.bankAmt, r.rbiAmt, r.diff].join(','); }).join('\n'));
    T('CSV export works offline', 'Blob download triggered', 'ifms_test_export_verification.csv generated', true,
      'Generated from ' + DB.recon.length + ' live reconciliation rows');
  }catch(e){ T('CSV export works offline', 'Blob download triggered', 'Error: ' + e.message, false); }

  ROUTE = 'help'; render();
  var btn = document.querySelector('[data-act="dlSample|portal"]');
  if(btn){
    try{ btn.click(); T('Sample download button present and working', 'Button found and clicked', 'sample_portal_transactions.csv downloaded', true); }
    catch(e){ T('Sample download button present and working', 'Button found and clicked', 'Error: ' + e.message, false); }
  }else{
    T('Sample download button present and working', 'Button found on the Help screen', 'Button not found', false);
  }
  ROUTE = 'recon'; render();
  var expBtn = document.querySelector('[data-tx="rcTbl"]');
  T('Reconciliation table export control present', 'Export CSV button rendered', expBtn ? 'Export CSV button rendered' : 'Not rendered', !!expBtn);

  var pass = res.filter(function(r){ return r.pass; }).length;
  var fail = res.length - pass;
  var result = { ts: nowStamp(), pass: pass, fail: fail, total: res.length, ms: Date.now() - t0, rows: res };
  DB.lastTest = result;
  audit('Test Suite', 'TESTS_RUN', 'Demo test suite', '', '', pass + ' passed / ' + fail + ' failed',
        'Automated verification of validation, reconciliation, exception, penal-interest and export behaviour');
  save();
  showTestResult(result);
}
function testResultHtml(result){
  var h = '<div class="grid g4 mb12">' +
    kpi(result.fail ? 'err' : 'ok', 'Tests passed', cnt(result.pass) + ' / ' + cnt(result.total), plain(result.pass / result.total * 100, 1) + '% success') +
    kpi(result.fail ? 'err' : '', 'Tests failed', cnt(result.fail), result.fail ? 'Review the rows marked FAIL' : 'No failures') +
    kpi('', 'Execution time', result.ms + ' ms', 'Run at ' + fmtStamp(result.ts)) +
    kpi('', 'Demo business date', fmtDate(bizDate()), 'Financial year ' + M().config.fy) + '</div>';
  h += '<div class="card-b tight" style="max-height:420px;overflow:auto;border:1px solid var(--grey-200);border-radius:var(--radius)">';
  result.rows.forEach(function(r){
    h += '<div class="testrow ' + (r.pass ? 'pass' : 'fail') + '">' +
         '<div class="st">' + (r.pass ? 'PASS' : 'FAIL') + '</div>' +
         '<div class="grow"><div class="strong">' + esc(r.name) + '</div>' +
         '<div class="small muted">Expected: ' + esc(r.expected) + ' &nbsp;&middot;&nbsp; Actual: ' + esc(r.actual) + '</div>' +
         (r.detail ? '<div class="tiny muted">' + esc(String(r.detail).slice(0, 300)) + '</div>' : '') +
         '</div></div>';
  });
  h += '</div>';
  return h;
}
function showTestResult(result){
  modal({ title:'Demo Test Suite — ' + (result.fail ? result.fail + ' failure(s)' : 'all tests passed'),
    sub: result.pass + ' passed, ' + result.fail + ' failed, ' + result.total + ' total', width:'w1100',
    body: testResultHtml(result),
    buttons:[
      { label:'Export results', cls:'btn-p', fn:function(){
          exportCSV('ifms_demo_test_suite_results.csv', ['Test', 'Expected', 'Actual', 'Result', 'Detail'],
            result.rows.map(function(r){ return [r.name, r.expected, r.actual, r.pass ? 'PASS' : 'FAIL', r.detail]; }),
            [['Report', 'Demo test suite results'], ['Run at', result.ts], ['Passed', result.pass], ['Failed', result.fail]]);
        }},
      { label:'Open Reconciliation Workbench', fn:function(){ go('recon'); } },
      { label:'Close' }]
  });
  toast(result.fail ? result.fail + ' test(s) failed — see the detail.' : 'All ' + result.total + ' tests passed.', result.fail ? 'err' : 'ok');
}

/* ===================== BOOT ===================== */
function boot(){
  var stored = load();
  if(stored){
    DB = stored;
    if(!DB.masters.config.bizDate) DB.masters.config.bizDate = '2026-09-15';
    ['batches', 'portal', 'bank', 'rbi', 'recon', 'exceptions', 'refunds', 'devolution',
     'vouchers', 'penalties', 'audit', 'notifications', 'invalidRows'].forEach(function(k){
      if(!DB[k]) DB[k] = [];
    });
    audit('System', 'SESSION_RESUME', 'Application', 'IFMS-REVENUE', '', '',
          'Existing browser data restored — ' + DB.portal.length + ' portal, ' + DB.bank.length + ' bank and ' +
          DB.rbi.length + ' RBI record(s), ' + DB.recon.length + ' reconciliation row(s).');
  }else{
    initialiseDemo();
  }
  try{
    var r = localStorage.getItem(LS_ROLE);
    if(r && USER_OF_ROLE[r]) ROLE = r;
  }catch(e){}
  if(!can('nav.' + ROUTE)) ROUTE = firstAllowedRoute();

  renderRoleSel();
  document.getElementById('roleSel').onchange = function(){
    var old = ROLE;
    ROLE = this.value;
    try{ localStorage.setItem(LS_ROLE, ROLE); }catch(e){}
    audit('Security', 'ROLE_SWITCH', 'Session', ROLE, roleName(old), roleName(ROLE), 'Active role changed in the prototype role switcher');
    if(!can('nav.' + ROUTE)) ROUTE = firstAllowedRoute();
    save(); render();
    toast('Active role: ' + roleName(ROLE) + '.', 'info');
  };
  document.getElementById('fySel').onchange = function(){
    if(!can('config.edit')){ toast('Only the System Administrator can change the financial year.', 'err'); this.value = M().config.fy; return; }
    var old = M().config.fy;
    M().config.fy = this.value;
    audit('Masters', 'FY_CHANGE', 'System configuration', 'fy', old, this.value, 'Financial year changed from the header');
    save(); render();
  };
  document.getElementById('bellBtn').onclick = showNotifications;
  document.getElementById('bellBtn').onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); showNotifications(); } };
  document.getElementById('quickBtn').onclick = quickActions;
  document.getElementById('menuToggle').onclick = function(){ document.getElementById('sidebar').classList.toggle('open'); };
  document.getElementById('bizDateChip').onclick = function(){
    if(!can('bizdate.edit')){ toast('Only the System Administrator can change the demo business date.', 'warn'); return; }
    modal({ title:'Demo business date', sub:'Used as "today" by the reconciliation engine', width:'w520',
      body:'<div class="box info mb12 small">Changing this date affects SLA ageing, suspense determination and exception due dates. Re-run reconciliation afterwards for the change to take effect.</div>' +
           '<div class="fld"><label>Demo business date</label><input type="date" class="inp" id="bdv" value="' + esc(bizDate()) + '"></div>',
      buttons:[{ label:'Cancel' }, { label:'Save', cls:'btn-p', fn:function(el){
        var v = tx(el.querySelector('#bdv').value);
        if(!validDate(v)){ toast('Enter a valid date.', 'err'); return; }
        var old = M().config.bizDate;
        M().config.bizDate = v;
        audit('Masters', 'BIZDATE_CHANGE', 'System configuration', 'bizDate', old, v, 'Demo business date changed');
        save(); render(); toast('Demo business date set to ' + fmtDate(v) + '. Re-run reconciliation to apply it.', 'ok');
      }}]});
  };
  document.getElementById('avatarBox').onclick = function(){
    var r = roleObj(ROLE);
    modal({ title:'Session profile', sub:'No authentication is performed in this prototype', width:'w520',
      body:'<dl class="kv"><dt>Signed in as</dt><dd class="mono">' + esc(curUser()) + '</dd>' +
           '<dt>Role</dt><dd>' + esc(r.name) + '</dd>' +
           '<dt>Responsibilities</dt><dd>' + esc(r.desc) + '</dd>' +
           '<dt>Financial year</dt><dd>' + esc(M().config.fy) + '</dd>' +
           '<dt>Demo business date</dt><dd>' + fmtDate(bizDate()) + '</dd>' +
           '<dt>Data stored</dt><dd>' + cnt(DB.portal.length + DB.bank.length + DB.rbi.length) + ' source record(s), ' +
           cnt(DB.recon.length) + ' reconciliation row(s), ' + cnt(DB.audit.length) + ' audit entry(ies) — all held in this browser only</dd></dl>',
      buttons:[{ label:'Close' }]});
  };
  save();
  render();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
